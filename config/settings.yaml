# Run-level knobs.  Everything the pipeline decides is driven from here,
# so tuning behaviour never means editing code.

window:
  lookback_hours: 48        # default, and the floor for fast-moving categories
  # Publish EVERYTHING that survives the window. Measured 2026-09-04: a run
  # harvests 1615 articles into 1070 clusters, 538 of them inside 24h — and
  # was publishing 40. Missing 93% of the day is not a summary, it is a
  # sample, and it is why The Hacker News looked like it was contributing
  # one story a day when it files a dozen.
  #
  # This costs no API calls. Only the shortlist is summarised by a model
  # (llm.max_items_summarized); everything else ships with the headline, the
  # source, the tags and the feed's own blurb. Coverage is complete and the
  # model spend is unchanged.
  # Set ABOVE the largest run ever measured so it never binds. 900 was still
  # a cut: a live harvest produces ~1,154 publishable items and the cap threw
  # away 254 of them, 111 from tech_ai alone.
  max_items_published: 2000 # cards written to the site

  # PER-CATEGORY WINDOWS. One window for everything was the single biggest
  # content bug in this project: on a live harvest, 21 of 43 feeds returned
  # nothing in 48h — not because they were broken (all were probed and work)
  # but because security and research blogs publish WEEKLY while news wires
  # publish 60 items a day.
  #
  # The result was a dashboard that was ~90% general news and almost none of
  # the releases, attacks and tools it is supposed to be about. Krebs,
  # Schneier, Trail of Bits, PortSwigger, Talos and Elastic Security Labs all
  # had zero items in 48h.
  #
  # Freshness should match how fast a field actually moves.
  per_category_hours:
    india_world:   48       # high volume, staleness is obvious
    markets:       48
    cyber_attacks: 96       # an exploited CVE stays relevant for days
    cyber_tools:   168      # a tool released Tuesday still matters Friday
    tech_ai:       120      # release cycles are weekly, not hourly

  # Per-category floor/ceiling so one prolific feed cannot own the page.
  # Without this a single high-volume wire filled 39 of 40 slots on a live run.
  # Also set so it does not bind. At 260 it silently dropped 111 tech_ai and
  # 59 cyber_attacks items on a measured run — the exact "only reads one or
  # two and leaves the rest" behaviour this work exists to remove. The floor
  # below is what actually protects the quieter sections; a ceiling this high
  # only guards against a single feed going haywire.
  per_category_max: 900
  # Guaranteed floor per category. Without it the topic scans flooded cyber
  # and AI and squeezed markets down to a single item on a live run — the
  # cap alone does not stop one section crowding out another.
  per_category_min: 3

# Publishing.
publish:
  # Google News links need two HTTP requests each to resolve to the real
  # publisher. That was ~40 requests when the page showed 40 stories; at
  # ~1,150 it stalled a rebuild for forty minutes. Spend them on the top of
  # the page — an unresolved link still redirects correctly in a browser.
  max_link_resolutions: 150

# Full-text extraction. One HTTP fetch per cluster lead, so this — not the
# number of published cards — is what sets the run's length. Everything past
# this limit keeps the feed's own blurb as its body, which is exactly what a
# card needs when no model is going to summarise it anyway.
extract:
  # Was 220. Extractive summaries ran to a median of 141 characters against
  # 438 for model-written ones — "not much" — because 944 of ~1,160 clusters
  # never had their article fetched and fell back to the feed blurb, whose
  # own median is 118 characters. There is nothing to extract from a blurb
  # that short. 220 fetches took 20-30s against a 75-minute workflow budget,
  # so the ceiling was pure caution.
  # Raised again, to above the cluster count, so nothing is left on a feed
  # blurb. At 700 the published page was bimodal: p75 was 677 characters but
  # p50 was 125, because ~390 cards past the cap never had their article
  # fetched and a blurb's own median is 118. Measured cost of 700 fetches
  # with the parse moved off the thread pool: 41 seconds. There is no budget
  # argument left for a cap below the number of clusters.
  max_items: 1400

# When the pipeline is scheduled to run. This is metadata only — the actual
# schedule lives in .github/workflows/newsdesk.yml and must be kept in step.
# The site reads it to tell the reader when the page will next refresh, which
# is the difference between "this looks stale" and "this is expected".
schedule:
  # WORK BACKWARDS FROM THE DEADLINE, because GitHub does not fire on time.
  # Measured across 12 runs of this repo, the gap from cron to FINISHED run
  # had a median of 5.5h (last three runs: 4.8, 4.9, 4.9h), a minimum of 1.1h
  # and a maximum of 18.8h — scheduled workflows queue behind paid capacity.
  #
  # The deadline is "done by 09:00 IST" = 03:30 UTC. 03:30 minus the 5.5h
  # median puts the cron at 22:00 UTC the previous day.
  #
  #   fires 22:00 UTC  ->  median finish 03:30 UTC = 09:00 IST
  #                    ->  recent-delay finish 02:54 UTC = 08:24 IST
  #
  # On a rare fast day it finishes around 04:30 IST and that morning's news
  # lands in the NEXT run instead — the harvest uses a 24-48h lookback, so
  # those stories are not lost, they arrive a day later flagged as new.
  cron_utc: "15 23 * * *"   # 23:15 UTC, aiming to finish by 04:30 UTC
  display_tz: "Asia/Kolkata"
  display_name: "by 10:00 IST"
  # Added to the cron time to estimate when the page really refreshes. The
  # site prints that estimate; printing the raw cron time told the reader the
  # page was overdue every morning for five hours while nothing was wrong.
  # Re-measured 2026-10-22 over the last 10 runs: median 5.2h, min 4.7h,
  # max 6.8h. This number DRIFTS — 5.5h in September, 2.8h on 7 October,
  # 5.2h now — so it is worth re-measuring whenever the page looks overdue.
  # At 3.0h the cron said "by 10:00 IST" while runs actually finished around
  # 12:11, so the page flagged itself overdue for two hours every morning.
  typical_delay_hours: 5.25

dedupe:
  # A dashboard shows a rolling window, so an article seen in an earlier run
  # must still appear today if it is still inside the window. What the seen
  # store prevents is paying to SUMMARISE the same article twice.
  #   reuse_summary : keep showing it, reuse the cached summary  (correct)
  #   suppress      : hide anything already published once       (digest-style)
  mode: reuse_summary

harvest:
  timeout_seconds: 15
  max_per_feed: 60
  # A plain bot UA gets 403s from PIB, TechCrunch and others. This is a
  # standard browser string: we are reading public RSS at low volume.
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# --- GitHub: what got BUILT, not what got written about --------------------
# NOTE ON SYNTAX: GitHub search rejects "topic:a OR topic:b" outright
# ("the search contains only logical operators"), so each search names ONE
# topic. Unauthenticated search is capped at 10 requests/minute, hence the
# pacing below; set GITHUB_TOKEN in .env to raise that to 30/min.
github:
  enabled: true
  lookback_hours: 168       # 7 days: a tool released Tuesday still matters Friday
  per_search: 12
  pace_seconds: 7           # stay under 10 searches/min unauthenticated
  token_env: "GITHUB_TOKEN" # optional; absent is fine
  searches:
    # Star floors do the heavy lifting — GitHub produces thousands of new
    # repos a week and nearly all are scaffolding, coursework or AI filler.
    - {category: cyber_tools, kind: new,     min_stars: 25, topic: security}
    - {category: cyber_tools, kind: new,     min_stars: 15, topic: pentesting}
    - {category: cyber_tools, kind: new,     min_stars: 10, topic: dfir}
    - {category: cyber_tools, kind: new,     min_stars: 10, topic: incident-response}
    - {category: cyber_tools, kind: new,     min_stars: 10, topic: threat-hunting}
    - {category: cyber_tools, kind: new,     min_stars: 15, topic: malware-analysis}
    - {category: cyber_tools, kind: new,     min_stars: 15, topic: red-team}
    - {category: cyber_tools, kind: updated, min_stars: 3000, topic: osint}
    - {category: tech_ai,     kind: new,     min_stars: 80, topic: llm}
    - {category: tech_ai,     kind: new,     min_stars: 50, topic: ai-agents}
    - {category: tech_ai,     kind: new,     min_stars: 40, topic: mcp}

# --- Bluesky: practitioner chatter that never becomes an article -----------
# Re-enabled 2026-08-24 after probing 30 handles: 12 post within 7 days.
# The first attempt seeded only 3 accounts, two of which were dormant, and
# concluded the whole source was dead. It was the sample that was dead.
#
# Only INDIVIDUALS are listed. Outlet accounts (Ars, Verge, CyberScoop) are
# active but only repost their own RSS, which is already harvested directly.
#
# Note: the public searchPosts endpoint returns 403 without auth, so topic
# search is not available — this is author feeds only.
# X/Twitter remains unused: free tier ended Feb 2026, reads are billed.
bluesky:
  enabled: true
  lookback_hours: 168       # individuals post weekly, not hourly
  per_account: 25
  min_chars: 80             # skip one-liners and reactions
  min_likes: 10             # unless the post carries a link
  accounts:
    - {handle: "troyhunt.com",              name: "Troy Hunt",        category: cyber_attacks}
    - {handle: "kimzetter.bsky.social",     name: "Kim Zetter",       category: cyber_attacks}
    - {handle: "404media.co",               name: "404 Media",        category: cyber_attacks}
    - {handle: "danielmiessler.bsky.social", name: "Daniel Miessler", category: cyber_tools}
    - {handle: "simonwillison.net",         name: "Simon Willison",   category: tech_ai}
    - {handle: "simonw.bsky.social",        name: "Simon Willison",   category: tech_ai}
    - {handle: "emollick.bsky.social",      name: "Ethan Mollick",    category: tech_ai}
    - {handle: "xeiaso.net",                name: "Xe Iaso",          category: tech_ai}
    - {handle: "jaredwhite.com",            name: "Jared White",      category: tech_ai}

# --- Vulnerability intelligence from JSON APIs -----------------------------
# Two of the most authoritative sources here publish no usable feed, and both
# were previously written off as unavailable:
#   CISA KEV  the XML endpoint 403s, the JSON one returns 200
#   NVD       NIST retired RSS entirely; the 2.0 REST API is free and keyless
#
# KEV is the single strongest signal this dashboard can carry: inclusion means
# CISA has evidence of exploitation IN THE WILD, not merely that a CVE exists.
#
# NVD asks for 5 requests per 30s without a key. This makes ONE per run, so
# that is not a concern — but do not paginate without adding sleeps.
vulns:
  enabled: true
  lookback_hours: 96
  kev: true
  nvd: true
  nvd_cvss_floor: 8.0       # high and critical only; below that is noise
  nvd_limit: 60

# --- Telegram: public channels ---------------------------------------------
# Read-only via t.me/s/<channel>, which any PUBLIC channel exposes. No bot,
# no token, no account — verified before this was added. Private channels
# have no such preview and would need a bot added to them.
#
# Channels break faster than articles: a CTI channel posts a link and a line
# of context within minutes, often before anyone writes the article. What
# they do not carry is body text, so stage 3 fetches it from the link.
telegram:
  enabled: true
  lookback_hours: 72
  min_chars: 40
  require_link: true        # commentary with no link has nothing to verify
  # These are PUBLIC channels being read, not owned. Reading needs no bot, no
  # token and no permission — it is the same page a browser would load.
  # How many preview pages to walk back per channel. t.me/s/<channel> serves
  # only the ~20 newest messages, so a channel posting more than that between
  # runs was being truncated with no sign of it. Overridable per channel.
  max_pages: 2
  channels:
    #
    # window_hours overrides the 72h default FOR THAT CHANNEL. Measured post
    # rates on 2026-08-26 (newest post at the time of probing):
    #   ctinow                 20 posts/day     newest  0h   -> default
    #   Cyber_Security_Channel  ~2 posts/day    newest  5h   -> default
    #   vxunderground          bursty, many with no link at all
    #                                           newest  3h   -> default
    #   androidMalware         ~1 post / 4 days newest 94h   -> 336h
    #   secharvester           ~1 post / week   newest 174h  -> 504h
    # Without the overrides the last two scored 0 posts on EVERY run: their
    # newest post is always older than 72h, so the window did not filter them,
    # it deleted them permanently.
    - {channel: "ctinow",         name: "CTI Now",        category: cyber_attacks, tier: C, max_pages: 5}
    - {channel: "vxunderground",  name: "vx-underground", category: cyber_attacks, tier: C}
    - {channel: "androidMalware", name: "Android Malware", category: cyber_attacks, tier: C, window_hours: 336}
    - {channel: "Cyber_Security_Channel", name: "Cyber Security Channel", category: cyber_attacks, tier: C}
    - {channel: "secharvester",   name: "SecHarvester",   category: cyber_tools, tier: C, window_hours: 504}

# --- Push the digest to Telegram -------------------------------------------
# ENTIRELY OPTIONAL. This is the only part that needs a bot, and it does one
# thing: send the digest to you. Reading channels above needs none of it.
#
# Skip this if you are happy opening the website. Nothing else depends on it.
#
# OFF by default and it stays off until you set it up, because it sends
# messages on your behalf.
#
# Only critical/important items are sent. The website is the full record;
# this is the "worth interrupting you for" subset. A channel that receives
# 40 cards every morning gets muted, which is worse than sending nothing.
#
# Setup:
#   1. @BotFather on Telegram -> /newbot -> copy the token
#   2. Pick a destination you CONTROL:
#        - simplest: message the bot directly; it will DM you the digest
#        - or: your own channel, with the bot added as an ADMIN
#      You cannot push to someone else's channel, only read it.
#   3. TELEGRAM_BOT_TOKEN=... in .env, then `python run.py --test-telegram`
#      which discovers and prints your chat id for you
#   4. Flip enabled to true below
notify:
  telegram:
    enabled: false
    token_env: "TELEGRAM_BOT_TOKEN"
    chat_env: "TELEGRAM_CHAT_ID"
    min_priority: important   # critical | important
    max_items: 10

cluster:
  # Overlap coefficient (shared tokens / shorter headline), NOT Jaccard.
  #
  # RECALIBRATED 2026-08-24 against a 427-article harvest. The original 0.55
  # was set on a general-news mix where the only pairs present happened to
  # score high; the real distribution has a dense band at 0.42-0.54 that was
  # being thrown away — TikTok/DOJ settlement (0.50), Guinea landfill (0.50),
  # Swedish school attack (0.43), robot 100m record (0.44) all sat below it.
  #
  # The clean separator is SHARED TOKEN COUNT, not the ratio: every genuine
  # pair in that band shared >=3 content words, and every false positive
  # ("US-Iran crude oil" vs "Nigeria cash in on Iran war") shared exactly 2.
  # Lowering the ratio while holding the floor at 3 nearly doubles
  # corroboration without admitting a single bad merge.
  title_similarity: 0.42
  min_shared_tokens: 3
  min_title_tokens: 4

trust:
  # Score contributions.  Total is clamped to 0-100.
  tier_points:   {A: 40, B: 25, C: 10}
  outlet_points: 12         # per additional independent outlet, capped below
  outlet_cap:    36
  primary_source_bonus: 30  # story traces to an official artifact
  # NOTE: verdicts are no longer threshold-based. They are rules over the
  # signals themselves (primary anchor / outlet count / source tier), because
  # a score threshold of 65 was unreachable for this feed mix and put 96% of
  # items on one label. trust_score is still computed and shown, but it
  # informs ranking, not the badge. See Verdict in pipeline/models.py.
  hard_drop:
    # blocklisted domains are dropped unconditionally in stage 2, before
    # anything is scored — there is no meaningful "score it anyway" mode.
    outside_window: true
    contradicted_claim: true

priority:
  # Final priority = weighted blend of three 0-100 components, then bucketed.
  weights: {trust: 0.25, interest: 0.45, corroboration: 0.30}

  # Thresholds are calibrated against the OBSERVED blend range, not an
  # imagined 0-100 spread. On a live 404-item run the blend topped out at
  # 49, so the original 75/50 buckets left every single item "minor".
  buckets: {critical: 58, important: 38}

  # Guard rails so the buckets stay meaningful when the news is quiet or
  # unusually busy: a share cap, and a hard cap on critical count.
  max_critical_share: 0.06    # at most 6% of published items may be critical
  max_critical: 5

interest:
  # Interest is a saturating curve on weighted keyword hits, not a raw count.
  # Title hits count double: a term in the headline is what the story is
  # about, the same term in the body may be an aside.
  title_weight: 2.0
  body_weight: 1.0
  saturation_k: 0.55          # 1 hit ~42, 2 ~67, 3 ~81, 5 ~94
  category_base: 12           # floor so an on-topic story is never a flat 0

  # NOTE: there is deliberately no primary-source bonus here. Coming from an
  # official source makes a story TRUSTWORTHY, not IMPORTANT — conflating the
  # two put five routine government press releases at the top of the first
  # live run. Primary sources are rewarded in trust scoring only.

  # Routine-notice damping: official feeds carry a lot of administrative
  # boilerplate that is perfectly true and of no interest.
  routine_penalty: 28
  routine_markers:
    - "joint working group"
    - "review meeting"
    - "inaugurates"
    - "addresses the"
    - "chairs the"
    - "workshop on"
    - "celebrated"
    - "observed on"
    - "felicitat"
    - "memorandum of understanding signed"
    # Speculation and punditry: high keyword density, near-zero news value.
    - "prediction for tomorrow"
    - "stocks to buy"
    - "stocks to watch"
    - "target price"
    - "may hit"
    - "could rally"
    - "top picks"
    - "what to expect"
    - "here's why"
    - "auction of government"
    - "variable rate reverse repo"

llm:
  provider: gemini          # none | gemini   (none = extractive, no API key)

  # TIERED MODELS. Free-tier limits differ enormously between models, and the
  # scarce one is worth spending only where quality is actually read.
  # Verified from aistudio.google.com/rate-limit on 2026-08-24:
  #
  #   gemini-3.6-flash        RPM 5    TPM 250K   RPD 20     <- premium, tiny quota
  #   gemini-3.5-flash-lite   RPM 15   TPM 250K   RPD 500    <- bulk, 25x headroom
  #   gemini-3.1-flash-lite   RPM 15   TPM 250K   RPD 500    <- spare bulk
  #
  # Batches are handed to the first tier until its per-run allowance is used,
  # then fall through to the next. Since batches are ordered best-first, the
  # strongest model summarises the stories most likely to be read.
  # THE LADDER. Every entry below was probed live on 2026-08-24 with a real
  # call and a structured-output schema; limits come from the account's own
  # rate-limit dashboard, not from documentation.
  #
  # Ordered by capability. Batches are handed to the first model with quota
  # left, and batches are ordered best-story-first, so the strongest model
  # always summarises the stories most likely to be read.
  #
  # NOT LISTED, and why:
  #   gemini-2.5-flash, gemini-2.5-flash-lite  -> HTTP 404, retired for new
  #     projects even though the dashboard still shows quota rows for them.
  #   gemini-2.5-pro, gemini-3.1-pro, 2 flash  -> quota shown as 0/0.
  #
  # Daily ceiling across the ladder is ~29,000 requests. This pipeline needs
  # about 5. The ladder exists so a bad day cannot silently degrade quality,
  # not because the volume is needed.
  tiers:
    # Flagship flash models: best quality, 20 requests/day each.
    - {model: "gemini-3.7-flash",      rpm: 5,  rpd: 20,    max_batches_per_run: 2}
    - {model: "gemini-3.6-flash",      rpm: 5,  rpd: 20,    max_batches_per_run: 2}
    - {model: "gemini-3.5-flash",      rpm: 5,  rpd: 20,    max_batches_per_run: 2}
    - {model: "gemini-3-flash-preview", rpm: 5, rpd: 20,    max_batches_per_run: 2}
    # Lite models: noticeably weaker prose, 25x the allowance — and the only
    # tiers that actually deliver. Measured across five consecutive runs, the
    # four flagships above failed EXACTLY TWICE EACH, EVERY DAY, and
    # contributed nothing: they are heavily contended on the free tier and
    # answer 503 to a real batch far more often than not. A direct probe
    # confirms they are not broken — gemini-3.5-flash served a full 20-article
    # batch in 29s — they are simply unavailable most of the time.
    #
    # So the budget cannot depend on them. 6 batches each left the ladder
    # delivering ~14 of the 20 batches a 400-item run needs, which is why the
    # page showed 134 model summaries against a 400 budget. 12 each covers
    # the whole run on reliable tiers alone, and costs 24 of the 425 usable
    # daily requests these models allow. The flagships stay on the ladder as
    # a bonus when they happen to answer.
    - {model: "gemini-3.5-flash-lite", rpm: 15, rpd: 500,   max_batches_per_run: 12}
    - {model: "gemini-3.1-flash-lite", rpm: 15, rpd: 500,   max_batches_per_run: 12}
    # Gemma: open-weight, enormous allowance, but TPM is 16K against 250K
    # for the Gemini models — so its batches must be small or they exceed
    # tokens-per-minute. Last resort, and it does honour the schema.
    # batch_size 3, not 6. The dashboard showed Gemma 4 26B peaking at
    # 17.87K TPM against a 16K ceiling — six articles at ~3.5K chars each
    # still overflows it, and a TPM breach costs the whole slice. The Flash
    # models have 250K TPM, which is why only these two need the override.
    - {model: "gemma-4-31b-it",        rpm: 30, rpd: 14400, max_batches_per_run: 8, batch_size: 3}
    - {model: "gemma-4-26b-a4b-it",    rpm: 30, rpd: 14400, max_batches_per_run: 8, batch_size: 3}

  # 20 items/batch, not 12. A live batch of 12 used 18.4K tokens against a
  # 250K TPM ceiling, so token budget was never the constraint — REQUESTS are.
  # Bigger batches mean fewer requests for the same work: 100 items now costs
  # 5 calls instead of 9.
  batch_size: 20

  # Only a shortlist goes to the model. Stage 4 scores every cluster (~315 on a
  # live run) but stage 7 publishes 40, so summarising everything spent ~27
  # calls to throw away ~23 of them. The shortlist is wider than the publish
  # cap so the model's importance score can still reorder the ranking.
  # Was 100 against a 40-item page. That over-bought by 60 items while the
  # flagship models (20 requests/day each) ran dry mid-run, leaving 12 of 40
  # published cards with extractive summaries instead of real ones.
  #
  # 60 keeps enough headroom for the model's importance score to reorder the
  # ranking, without paying for a tail that never reaches the page.
  # Must be comfortably WIDER than the publish cut, per category.
  #
  # At 60 across 5 categories each got ~12 — exactly the per-category publish
  # quota — so anything reaching the page outside its category's top 12 by
  # KEYWORD score had never been summarised. Measured on a live run: only
  # 14 of 40 published cards carried a real summary; the other 26 were
  # extractive fallbacks. The model's importance score reorders the ranking,
  # so an item sitting 20th on keywords routinely ends up published.
  #
  # Sized empirically, by replaying a finished run and asking how many of the
  # 40 cards that actually published would have been in the shortlist:
  #
  #    limit  60 (x1.5) ->  14/40      <- the observed failure, reproduced
  #    limit  60 (x2.0) ->  18/40
  #    limit 100 (x2.0) ->  35/40
  #    limit 120 (x2.0) ->  35/40
  #    limit 150 (x2.0) ->  40/40      <- full coverage
  #
  # 150 costs ~8 calls against a ladder that allows 36 batches a run, and the
  # summary cache means repeat items are not paid for twice.
  # The ladder can serve ~440 items a run (4 flagship x 2 batches x 20, plus
  # 2 flash-lite x 6 x 20, plus what the gemma tiers manage at batch_size 3).
  # Sitting at 150 left ~290 items of FREE capacity unused every single day
  # while most of the page shipped as bare headlines — the single biggest
  # quality win available, and it costs nothing. Anything past the ladder's
  # real capacity still degrades to extractive exactly as before.
  max_items_summarized: 400
  # Hard ceiling on the second pass that rescues publishable items the model
  # promoted after the shortlist was chosen. Without it the pass sizes itself
  # from the publish cap, which is now 900 — that would be ~38 extra batches
  # on a run that otherwise makes about ten calls in total.
  top_up_max: 40
  # Headroom on each category's share of max_items_summarized, NOT of the
  # publish quota — reading the publish quota here was the bug fixed in
  # 3c950dc. Allocation per category is max_items_summarized / categories,
  # times this.
  shortlist_multiplier: 2.0
  api_key_env: "GEMINI_API_KEY"

  # Hard stop on API usage. The counter is persistent and keyed by UTC date,
  # matching how providers reset quota. Per-model, because the limits are.
  #
  # Hitting a cap is not an error: the run continues and the remaining items
  # get extractive summaries, so you always get a page — just a plainer one.
  # A real provider 429 is different: the rest of the run is abandoned rather
  # than retried, because hammering a closed door can extend the cooldown.
  budget:
    enabled: true
    reserve_fraction: 0.15  # keep 15% of each model's RPD spare for --test-llm
    pace: true              # sleep between calls to respect RPM

# --- Stage 6b: independent cross-model validation --------------------------
# A second model re-checks whether each claim is actually supported by the
# source. Deliberately a DIFFERENT model than the one that wrote the summary:
# a model grading its own work agrees with itself.
#
# Runs on the cheapest tier with quota left (Gemma allows 14,400/day against
# the ~5 this pipeline uses), so the check costs effectively nothing.
judge:
  enabled: true
  # Scoped to what a wrong claim would actually cost. A measured run spent 5
  # calls and ~4 minutes to return 28 "all claims supported", 1 unsupported
  # and 0 rejections — nearly all of that on MINOR items nobody acts on.
  #
  # The claims on every item have already passed the deterministic span check
  # in stage 6, so the judge is hunting a narrower failure: the quote is real
  # but the inference from it is wrong. That is worth catching on a story you
  # might act on today, and not worth four minutes on the tail.
  max_items: 18
  min_priority: important   # critical | important | minor
  batch_size: 9
  prefer_cheap_model: true  # independence and volume matter more than prose

verify:
  # Stage 6 is the cheap, deterministic half of validation: it checks that
  # each claim's supporting quote actually appears in the article, which
  # catches a model inventing its own evidence.
  #
  # The semantic half — "the quote is real but the claim misreads it" — is
  # handled by the cross-model judge in stage 6b, not by a local NLI model.
  # A 400MB entailment model was planned here and dropped: the judge does the
  # same job using quota that is already free.
  min_entailed_ratio: 0.7   # below this, an item cannot hold CRITICAL
