  # --- Bug bounty and exploit writeups -----------------------------------
  # window_hours overrides the category window. These labs publish once or
  # twice a MONTH; under the 168h category window every one of them returned
  # zero items despite the feeds working. A month-old teardown of a pre-auth
  # RCE has not stopped being worth reading.
  #
  # Measured cadence 2026-08-24 (newest post age): Sonar 12 items inside 30d,
  # PortSwigger 3, Trail of Bits 2, watchTowr 1, Include Security 1;
  # Doyensec 68d, OALabs 69d, Project Zero 103d, Assetnote 949d.
  # The slow ones contribute nothing most weeks and that is fine — they cost
  # one HTTP request and appear the day they publish.
  # "How they did it" content: disclosed bugs with the methodology attached,
  # not just the announcement that a bug existed. All probed live 2026-08-24.
  #
  # REMOVED 2026-10-23: Assetnote Research (blog.assetnote.io/feed.xml).
  # "Kept only because it is free to keep" stopped being true. The feed
  # fetches fine — 200, 10 entries — but its newest post is 24,193 hours
  # old (1,008 days, up from the 949 recorded above), against the 720h
  # window it was harvested under. It cannot contribute, on any run, until
  # they publish again; this is arithmetic, not a judgement about the blog.
  # Not an exclusion: re-add it the day assetnote.io posts something.
  - {name: "watchTowr Labs",      url: "https://labs.watchtowr.com/rss/",                       tier: A, window_hours: 720}
  - {name: "Doyensec",            url: "https://blog.doyensec.com/atom.xml",                    tier: A, window_hours: 720}
  - {name: "Include Security",    url: "https://blog.includesecurity.com/feed/",                tier: B, window_hours: 720}
  - {name: "Sonar Research",      url: "https://www.sonarsource.com/blog/rss.xml",              tier: B, window_hours: 720}
  - {name: "InfoSec Write-ups",   url: "https://infosecwriteups.com/feed",                      tier: C}
