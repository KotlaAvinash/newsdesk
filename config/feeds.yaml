  # --- Verified additions 2026-08-25 -------------------------------------
  # Every URL below was fetched and parsed on the day it was added, and its
  # entry count and newest-entry age recorded. Deliberately EXCLUDED, so
  # nobody re-adds them:
  #   MSRC update-guide  4,704 entries in one response - a CVE firehose, not
  #                      a news feed; it would swamp scoring
  #   Synacktiv          parses, but pubDate is EMPTY - no date at all, so it
  #                      contributes nothing under any lookback window
  #   NVD RSS            retired by NIST; cvefeed.io is the substitute
  #   CISA KEV xml       403 (the .json works but needs a custom adapter)
  #   Reddit, Oracle, Akamai, Hackread, Socket.dev, Outpost24
  #                      403 to bot AND browser UAs - Cloudflare-level, so no
  #                      UA workaround exists
  #   Pentester Land, HackerOne, Bugcrowd
  #                      no working RSS exists at all; do not retry
  # Feeds that PARSE but are abandoned were skipped too: Sam Curry (318d old),
  # Rhino (363d), ret2 (440d), Aqua Nautilus (476d), Alex Chapman (792d).
  - {name: "ZDI Advisories", url: "https://www.zerodayinitiative.com/rss/published/", tier: A, primary: true}
