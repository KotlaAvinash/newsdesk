  # --- Google News topic scans -------------------------------------------
  # Viable now that redirect tokens resolve to real publisher URLs (see
  # pipeline/gnews.py). These cast a much wider net than any single outlet:
  # one query returned 53 ransomware stories where the dedicated feeds had 3.
  # tier C because a search result is unvetted; the publisher is read from
  # the title so clustering and outlet-counting still see the true source.
  - {name: "GN Zero-day watch", url: "https://news.google.com/rss/search?q=zero-day+OR+%22actively+exploited%22+vulnerability+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
