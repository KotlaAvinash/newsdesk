<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --card:#fff; --ink:#1c1b19; --ink2:#3d3b37; --muted:#6f6c66;
  --line:#e6e3dc; --line2:#d5d1c7; --accent:#8a5a2b;
  /* --imp was #a8701a at 3.99:1 and --minor #8f8b83 at 3.22:1 on this
     background: both under the 4.5:1 AA floor for the small, bold text
     they are used on. Darkened to clear it while keeping the hue.
     --warn was #9a6a12, which measures 4.49:1 here — one hundredth under the
     same floor, and it carries .chip-warn, 10.5px uppercase bold, on the 160
     cards a day whose verdict is "unverified". #946510 is 4.83:1. */
  --crit:#b3341f; --imp:#8a5a15; --minor:#6e6a63;
  --ok:#1c6b45; --warn:#946510; --bad:#7a3f96;
  --factbg:#f4f2ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14140f; --card:#1c1c18; --ink:#eae7df; --ink2:#c9c5bb; --muted:#928e85;
  --line:#2c2b26; --line2:#3a3833; --accent:#d9a066;
  /* The light palette was audited for AA, the dark one was not. --minor was
     #7d7a72, 4.31:1 on this background, and it carries the two smallest bold
     strings on every card: the "unsummarised" chip (530 cards a day) and the
     "Source:" label (all 835). #847f78 is 4.65:1 — a seven-point lift, which
     is below the threshold of noticing but above the AA floor. */
  --crit:#ff7a63; --imp:#e3a94f; --minor:#847f78;
  --ok:#5fc999; --warn:#e0bb5c; --bad:#c58ede;
  --factbg:#232320;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 line-height:1.65;-webkit-font-smoothing:antialiased;
 /* Fluid base size: 15.5px on a small phone up to 17px on a desktop, so the
    measure stays readable without a stack of breakpoints. */
 font-size:clamp(15.5px, 0.95rem + 0.18vw, 17px)}

/* Measure, not pixels. ~55 cpl gave the best comprehension in Dyson &
   Haselgrove and read FASTER than short lines; the usable band is 45-75 and
   should not pass ~70. 64ch on the body font lands mid-band. */
.wrap{margin:0 auto;
 padding:clamp(12px, 2.5vw, 22px) clamp(14px, 4vw, 20px) 100px;
 /* `min(64ch + 4rem, ...)` silently does nothing — an addition inside min()
    needs calc(). The first attempt measured 81 characters per line, past the
    45-75 band entirely. */
 max-width:min(calc(54ch + 3rem), 38.5rem)}
main, header, .controls{max-width:100%}

/* Never let a long URL, code span or unbroken token push the page sideways. */
h3, .body, .deck, ul.facts li, .why{overflow-wrap:break-word}

header{margin-bottom:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:"Newsreader",Georgia,serif;font-weight:600;
 letter-spacing:-.015em;font-size:clamp(24px, 5vw, 31px)}
.meta{color:var(--muted);font-size:13px;line-height:1.55}
.meta .dim{opacity:.75}
.meta .sep2{opacity:.7;margin:0 2px}
.meta .tzn{opacity:.9}
.meta span[title]{cursor:help}
.stale{margin-top:12px;padding:9px 13px;border-radius:8px;font-size:13px;
 background:color-mix(in srgb, var(--imp) 16%, transparent);
 color:var(--ink);border:1px solid color-mix(in srgb, var(--imp) 40%, transparent)}
@media (max-width:600px){
  .brand{gap:4px}
  .meta{font-size:12px}
  /* Measured: header 276px + controls 329px put the first headline at y=766
     of an 812px screen — the entire opening view was chrome and not one
     story was visible. Everything that is a refinement rather than an entry
     point now lives inside the Filters panel, which is closed by default;
     what remains on the opening screen is the title, one meta line, the
     stats row, the search box and two scrolling rows of chips. Measured
     again at 375x812: the first headline is at y=362.
     This block sits BEFORE the base rules for .stats, .controls and .tagbar,
     and a media query does not add specificity — so three declarations that
     used to live here (.stats{display:none}, .controls{padding:8px 0 6px},
     .tagbar{margin-top:8px}) were being overwritten by the plain .stats /
     .controls / .tagbar rules further down and had never once taken effect.
     The two that are still wanted have moved to the small-screen block at
     the bottom of the sheet, which comes after them. The third,
     .stats{display:none}, is deliberately NOT reinstated: hiding the counts
     would buy 64px of header and cost the only route to "5 need attention"
     on a phone, which is the most valuable filter on a page of 835 cards.
     The later block tightens the row instead. */
  header{margin-bottom:8px}
  h1{font-size:21px}
}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px;font-size:12.5px;
 color:var(--muted);padding-bottom:0;border-bottom:none}
.stats b{color:var(--ink);font-weight:600}
/* Each count is a control, so it has to look like one. Underlined-on-hover
   rather than boxed: six boxes across the top read as a toolbar and pull the
   eye away from the first headline, which is what the page is for. */
.stat{border:0;background:none;font:inherit;font-size:inherit;color:var(--muted);
 padding:2px 0;cursor:pointer;border-bottom:1px dotted var(--line2);
 border-radius:0;font-family:inherit}
.stat:hover{color:var(--ink);border-bottom-color:var(--muted)}
.stat[aria-pressed=true]{color:var(--ink);border-bottom:1px solid var(--accent)}
.stat[aria-pressed=true] b{color:var(--accent)}
.stat.lead b{color:var(--accent);font-size:1.15em}

/* the rejected list */
/* Applied-filter summary. Deliberately the loudest thing between the
   controls and the first headline: it is the only feedback that a date band
   changed anything, because the cards at the top of the list do not. */
#applied{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 margin:14px 0 2px;padding:9px 12px;border-radius:9px;
 background:var(--factbg);border:1px solid var(--line2);font-size:13px}
#applied[hidden]{display:none}
#applied .ap-n{color:var(--muted);white-space:nowrap}
#applied .ap-n b{color:var(--ink);font-weight:600;
 font-variant-numeric:tabular-nums}
#applied .ap-list{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0}
/* nowrap keeps a two-word label like "Since yesterday" from breaking in half,
   but one of these pills is the search string the reader typed. Measured at
   375px with a 71-character query: the pill rendered 464px wide inside a
   345px bar and the Clear button went off the right edge of the screen.
   Truncate instead — the full query is still in the search box above and in
   the "Nothing matches" line below. */
#applied .ap-b{background:var(--card);border:1px solid var(--line2);
 border-radius:999px;padding:2px 9px;color:var(--ink2);font-size:12px;
 white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#applied .ap-x{margin-left:auto;border:1px solid var(--accent);
 background:transparent;color:var(--accent);border-radius:7px;
 padding:3px 11px;font:inherit;font-size:12px;cursor:pointer;flex:0 0 auto}
#applied .ap-x:hover{background:var(--accent);color:var(--bg)}
@media (max-width:600px){ #applied{margin-top:10px;padding:8px 10px} }

.chip-raw{background:transparent;color:var(--minor);
 border:1px dashed var(--line2);border-radius:5px;padding:1px 7px;
 font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
 cursor:help}
.chip-held{background:color-mix(in srgb, var(--bad) 20%, transparent);
 color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 45%, transparent);
 border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:600;
 letter-spacing:.05em;text-transform:uppercase}
.heldwhy{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 11px;
 padding-left:11px;border-left:2px solid color-mix(in srgb, var(--bad) 40%, transparent)}

.rejnote{color:var(--muted);font-size:13px;margin:18px 0 0;line-height:1.6}
ul.rejlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:11px}
ul.rejlist li{font-size:14px;line-height:1.5}
ul.rejlist a{color:var(--ink2);text-decoration:none}
ul.rejlist a:hover{text-decoration:underline;text-underline-offset:3px}
ul.rejlist .dom{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* controls — the bar retracts on scroll-down so it never sits over the text */
.controls{position:sticky;top:0;z-index:5;background:var(--bg);
 padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px;
 transition:transform .22s ease, opacity .22s ease}
.controls.hidden{transform:translateY(-115%);opacity:0;pointer-events:none}

/* Row 1 — search and the one button that reveals everything else. */
.row1{display:flex;align-items:center;gap:8px}
.row1 .toggle{flex:0 0 auto;white-space:nowrap;padding:8px 12px}
.fdot{display:inline-block;width:6px;height:6px;border-radius:50%;
 background:var(--accent);margin-left:6px;vertical-align:middle}
.toggle[aria-expanded=true] .fdot{background:var(--bg)}

/* Sections stay on ONE line and scroll sideways. Wrapping cost a second row
   of chrome on every phone and most laptops, for a list that is five items
   long and never grows. */
.strip{margin-top:8px;overflow-x:auto;overscroll-behavior-x:contain;
 scrollbar-width:none;-ms-overflow-style:none;
 -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);
 mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.strip::-webkit-scrollbar{display:none}
.strip .chips{flex-wrap:nowrap;margin-top:0;padding-right:22px}
.strip .chip{flex:0 0 auto;white-space:nowrap}
/* The focus row sits under the sections and reads as a refinement of them,
   so it is one step quieter: smaller, no border until hovered or active. */
#focusStrip{margin-top:6px}
#focusStrip .chip{font-size:11.5px;padding:3px 9px;border-color:transparent;
 background:var(--factbg)}
#focusStrip .chip:hover{border-color:var(--line2)}
#focusStrip .chip[aria-pressed=true]{background:var(--accent);color:var(--bg);
 border-color:var(--accent)}
#focusStrip[hidden]{display:none}

/* Everything secondary. Closed on load; opening it costs one tap and the
   reader keeps the whole first screen for stories until they ask for it. */
/* Collapsing with max-height:0 hides a control visually but leaves it in the
   tab order and in the accessibility tree. Measured on a phone with the
   panel shut: 46 focusable controls — five date bands, New only, three
   sorts, two buttons and all 36 tag chips — sit between the search box and
   the first story, every one of them painted into a zero-height clip so the
   focus ring is invisible. A keyboard reader tabbing from search pressed Tab
   46 times against a page that appeared not to react.
   visibility carries a zero-length transition with a delay rather than none
   at all: opening flips it immediately (delay 0) so the chips are painted
   while the box grows, closing holds it until .25s has passed so the content
   does not blink out before the box has finished collapsing. */
#panel{max-height:0;overflow:hidden;visibility:hidden;
 transition:max-height .25s ease, visibility 0s linear .25s}
#panel.open{max-height:60vh;overflow:auto;visibility:visible;
 transition:max-height .25s ease, visibility 0s linear 0s}
#activeTags{margin-top:8px}
#activeTags:empty{display:none}

/* Reading state: the bar keeps the section strip and drops everything else,
   so the sticky chrome over the text is one 34px row instead of four. */
.controls.compact{padding:5px 0 4px}
.controls.compact .row1, .controls.compact #activeTags{display:none}
.controls.compact .strip{margin-top:0}
@media (prefers-reduced-motion:reduce){
  .controls, #panel, #tagchips{transition:none}
}
.tagbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.toggle{border:1px solid var(--line2);background:transparent;color:var(--muted);
 border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;
 font-family:inherit}
.toggle:hover{color:var(--ink);border-color:var(--muted)}
.toggle[aria-expanded=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* The escape hatch. Warm rather than red - clearing filters is a normal
   move, not a destructive one - and it goes flat when there is nothing set,
   which is most of the time. */
.toggle.clear:not(:disabled){color:var(--accent);border-color:var(--accent)}
.toggle.clear:not(:disabled):hover{background:var(--accent);color:var(--bg)}
.active-tags{display:flex;flex-wrap:wrap;gap:5px}
.active-tags .chip{background:var(--accent);color:var(--bg);border-color:var(--accent)}
/* Same clipped-but-focusable problem as #panel, and worse: this one holds 36
   chips. It genuinely collapses at every width, so unlike #panel it needs no
   desktop exception. */
#tagchips{margin-top:8px;max-height:0;overflow:hidden;visibility:hidden;
 transition:max-height .25s ease, visibility 0s linear .25s}
#tagchips.open{max-height:230px;overflow:auto;visibility:visible;
 transition:max-height .25s ease, visibility 0s linear 0s}
#q{flex:1 1 auto;min-width:0;padding:9px 13px;font:inherit;font-size:15px;
 color:var(--ink);background:var(--card);border:1px solid var(--line2);
 border-radius:9px}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
#q::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);
 border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;
 font-family:inherit;line-height:1.5}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* A disabled control rendered at full opacity with a pointer cursor is
   indistinguishable from a working one, so clicking it and getting nothing
   reads as the page being broken rather than as "there is nothing here".
   Both disabled controls now say so, and say why on hover. */
.chip:disabled, .toggle:disabled{opacity:.4;cursor:not-allowed}
.chip:disabled:hover, .toggle:disabled:hover{color:var(--muted);
 border-color:var(--line2)}
/* was opacity .55 -> 2.17:1, effectively invisible. */
.chip .n{opacity:.8;margin-left:5px;font-variant-numeric:tabular-nums}
.chip .sep3{opacity:.55;margin-right:4px}


/* sections */
h2.sec{font-family:"Newsreader",Georgia,serif;font-size:13px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--muted);margin:38px 0 4px;font-weight:600;
 padding-bottom:8px;border-bottom:1px solid var(--line)}

/* card — an explicit type scale with real steps between layers.
   Layer-cake scanning only triggers when heading and body are UNMISTAKABLY
   different; layers within 2px of each other read as one grey block. */
article{padding:24px 0;border-bottom:1px solid var(--line)}
article:last-child{border-bottom:none}

/* Chips appear on exceptions only. Pennycook et al: labelling a subset makes
   the unlabelled subset read as verified, so a chip on every card is both
   decoration and a false claim about everything else. */
.rail{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.chip-crit,.chip-warn{font-size:10.5px;letter-spacing:.09em;font-weight:700;
 text-transform:uppercase;padding:2px 8px;border-radius:4px}
.chip-crit{background:var(--crit);color:var(--bg)}
.chip-new{background:var(--accent);color:var(--bg);font-size:10.5px;
 letter-spacing:.09em;font-weight:700;text-transform:uppercase;
 padding:2px 8px;border-radius:4px}
.chip-warn{background:transparent;color:var(--warn);
 border:1px solid color-mix(in srgb, var(--warn) 55%, transparent)}

/* Layer 1 — headline. The only thing guaranteed to be read. */
h3{margin:0 0 9px;font-family:"Newsreader",Georgia,serif;
 font-size:clamp(19px, 3.2vw, 22px);
 line-height:1.3;font-weight:600;letter-spacing:-.012em}
h3 a{color:inherit;text-decoration:none}
h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;
 text-underline-offset:3px}

/* Layer 2 — the deck. One framing line, not three. This is where readers
   stop, so it has to carry the concrete facts rather than an abstraction. */
.deck{font-size:15px;line-height:1.55;color:var(--ink2);margin:0 0 11px;
 font-weight:400}

/* Key facts are the default body now, not a decorative aside. Concrete
   specifics are what survives into memory. */
ul.facts{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px}
ul.facts li{font-size:13.5px;line-height:1.5;color:var(--ink2);
 padding-left:15px;position:relative}
ul.facts li:before{content:"";position:absolute;left:0;top:.6em;
 width:4px;height:4px;border-radius:50%;background:var(--accent)}
ul.facts b{color:var(--ink);font-weight:600}

/* Behind disclosure: the prose summary and the audit trail. */
.body{font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.7;
 color:var(--ink2);margin:10px 0 12px}
.why{font-size:13.5px;color:var(--muted);margin:0 0 12px;font-style:italic}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0}
.tag{background:transparent;border:1px solid var(--line2);color:var(--muted);
 font-size:11px;padding:2px 8px;border-radius:5px;cursor:pointer;
 font-family:inherit;letter-spacing:.02em}
.tag:hover{color:var(--accent);border-color:var(--accent)}

/* Named outlets, not a bare count: a single transparency feature moves
   nothing, concrete named indicators measurably raise trust. */
.srcs{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12.5px;
 align-items:baseline;margin-bottom:11px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line2)}
.srcs a:hover{color:var(--ink);border-bottom-color:var(--muted)}
.srcs a.primary{color:var(--ok);border-bottom-color:var(--ok)}
.srcs .dot2{opacity:.4}
/* An explicit label. "Who says this" is the first question a reader asks of
   an unfamiliar headline, and a bare underlined name did not answer it. */
.srcs .srclabel{color:var(--minor);font-weight:600;letter-spacing:.02em}
.srcs .srcmore{margin:0;display:inline-block}
.srcs .srcmore summary{font-size:12.5px;color:var(--muted);min-height:0;
 display:inline-block;padding:0}
.srclist{display:grid;gap:5px;margin:8px 0 2px;padding:9px 11px;
 background:var(--factbg);border-radius:7px;min-width:240px}
.srcrow{display:flex;gap:10px;align-items:baseline;
 justify-content:space-between;font-size:12.5px}
.srcrow .dom{color:var(--muted);opacity:.75;font-size:11.5px;white-space:nowrap}
.srcs .when{margin-left:auto;opacity:.8}

details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;
 display:inline-block}
summary::-webkit-details-marker{display:none}
/* The gap after the marker was two spaces inside the content string, and an
   inline-block strips its own trailing whitespace — so every disclosure on
   every card rendered as "›Full summary", marker jammed against the word. A
   margin cannot be stripped. */
summary:before{content:"\203A";display:inline-block;margin-right:.45em;
 transition:transform .15s}
details[open] summary:before{transform:rotate(90deg)}
details ul{margin:9px 0 0;padding-left:19px;color:var(--muted);font-size:13px;
 line-height:1.6}

mark{background:color-mix(in srgb, var(--accent) 26%, transparent);
 color:inherit;padding:0 1px;border-radius:2px}

.loadmore{display:block;width:100%;margin:26px 0 0;padding:13px;
 border:1px solid var(--line2);background:transparent;color:var(--ink);
 border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.loadmore:hover{border-color:var(--muted);background:var(--card)}
.loadmore .rest{color:var(--muted);font-size:13px}

.empty{color:var(--muted);padding:60px 0;text-align:center;font-size:15px;
 line-height:2.2}

/* sort control + live result count */
.lbl2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);font-weight:600}
#sorts{margin-top:0}
.count{font-size:12.5px;color:var(--muted);margin-left:auto}
h2.sec .win{font-weight:400;letter-spacing:0;text-transform:none;
 color:var(--muted);cursor:help;font-size:11.5px}

/* claims — the validation working, shown rather than asserted */
.claims{margin:9px 0 4px}
.claims > b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--muted);font-weight:600}
.claims ul{list-style:none;padding:0;margin:7px 0 0;display:grid;gap:6px}
.cl{display:grid;grid-template-columns:1.1em 1fr;gap:7px;font-size:13px;
 line-height:1.5;color:var(--muted)}
.ck{font-weight:700;text-align:center}
.cl.entailed .ck{color:var(--ok)}
.cl.contradicted .ck{color:var(--crit)}
.cl.contradicted{color:var(--ink)}
.cl.neutral .ck{color:var(--warn)}
details ul.tr{margin-top:10px}
/* Nested one level down and visually quieter than its parent, so it reads as
   a footnote to the summary rather than a second section of equal weight. */
.score{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.score > summary{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
 font-weight:600}

/* --- Desktop: the controls become a rail --------------------------------
   Below this width the bar has to sit above the text and therefore over it
   while scrolling. Past it there is dead margin either side of a 55-character
   measure doing nothing, so the filters move into that margin: the reading
   column keeps its measure, the controls are permanently visible, and
   nothing is ever laid on top of a sentence. */
@media (min-width:1000px){
  .wrap{max-width:min(calc(54ch + 3rem + 270px), 62rem);
        display:grid;grid-template-columns:230px minmax(0,1fr);
        column-gap:40px;align-items:start;
        padding-top:clamp(20px,2.5vw,34px)}
  header{grid-column:1 / -1;margin-bottom:20px;padding-bottom:14px;
         border-bottom:1px solid var(--line)}
  #applied{grid-column:2;grid-row:2;min-width:0;margin-top:0}
  main{grid-column:2;grid-row:3;min-width:0}
  #foot{grid-column:2;grid-row:4;min-width:0}
  .controls{grid-column:1;grid-row:2 / span 3;position:sticky;top:22px;
            padding:0;margin:0;border-bottom:none;
            max-height:calc(100vh - 44px);overflow-y:auto;
            scrollbar-width:thin}
  /* Nothing retracts or collapses up here — there is room for all of it. */
  .controls.hidden{transform:none;opacity:1;pointer-events:auto}
  .controls.compact .row1, .controls.compact #activeTags{display:block}
  .row1{display:block}
  .row1 .toggle{display:none}
  .row1 #q{width:100%}
  /* .open can survive a resize from a narrow window; both states are the
     same up here, so pin them together rather than leaving a 60vh cap on a
     rail that is already scrollable. The panel is permanently open in the
     rail and usually carries no .open class, so visibility has to be pinned
     with it or the whole rail would disappear. */
  #panel, #panel.open{max-height:none;overflow:visible;visibility:visible}
  .strip{overflow:visible;margin-top:12px;
         -webkit-mask-image:none;mask-image:none}
  .strip .chips{flex-wrap:wrap;padding-right:0}
  .tagbar{margin-top:14px}
  #tagchips.open{max-height:260px}
  .count{margin-left:0}
  h2.sec{margin-top:0}
  main h2.sec ~ h2.sec{margin-top:34px}
}

/* keyboard focus must be visible — the site is navigable by j/k */
a:focus-visible, button:focus-visible, summary:focus-visible,
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
 border-radius:4px}
article.cursor{box-shadow:-14px 0 0 -11px var(--accent)}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);
 color:var(--bg);padding:9px 14px;border-radius:0 0 8px 0;z-index:20}
.skip:focus{left:0}
kbd{font:inherit;font-size:.86em;border:1px solid var(--line2);
 border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink)}

@media print{
  .controls,.skip,.stats,footer details{display:none !important}
  body{font-size:11pt;background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  article{page-break-inside:avoid;border-bottom:1px solid #ccc}
  .srcs a:after{content:" (" attr(href) ")";font-size:9pt;color:#555}
  details{display:none}
}

/* --- Small screens ---------------------------------------------------- */
@media (max-width:600px){
  /* Chips become finger-sized. 32px is the practical floor for a tap target
     that sits in a wrapping row. */
  .chip,.toggle{padding:7px 13px;font-size:13px;min-height:32px}
  /* Measured at 23.3px and 20.6px — both under the 24px WCAG 2.5.8 floor,
     and they are the smallest targets on the page. */
  .srcs a{min-height:32px;display:inline-flex;align-items:center}
  summary{min-height:32px;display:inline-flex;align-items:center}
  .tag{padding:5px 10px;font-size:12px;min-height:30px}
  /* The stats row wraps to two lines on a phone; tighten it so the header
     does not eat half the first screen. */
  .stats{gap:4px 12px;font-size:12.5px}
  /* Rescued from the phone block at the top of the sheet, where they sat
     ahead of the base .controls / .tagbar rules and never applied. */
  .controls{padding:8px 0 6px}
  .tagbar{margin-top:8px}
  article{padding:22px 0}
  /* A retracting bar is more disruptive on a short viewport than a static
     one, so on phones it simply scrolls away with the page. */
  .controls{position:static}
  .controls.hidden{transform:none;opacity:1;pointer-events:auto}
  #tagchips.open{max-height:210px}
  /* Under 16px iOS zooms the whole page in the moment the field takes focus
     and never zooms back out. This block sits after the base #q rule; the
     earlier phone block does not, which is why the value was being lost. */
  #q{font-size:16px;padding:9px 12px}
}

/* --- Tablet ----------------------------------------------------------- */
/* This band carried .wrap{max-width:100%}, which threw the measure cap away
   for every width from 601 to 900 — the one constraint the top of this sheet
   argues for hardest. Measured at 768px: the deck ran 86 characters per line
   and the key facts 95, wider than the 81 that is recorded up there as
   "past the 45-75 band entirely" and well past the ~70 ceiling it sets.
   Every other width honours the cap — 42 cpl at 375, 73 at 935, 74 at 1265 —
   so only the gutters belong in this block. Removing the one declaration
   brings 768 to 68 cpl for the deck and 76 for the facts, in line with the
   desktop column rather than half again as wide. */
@media (min-width:601px) and (max-width:900px){
  .wrap{padding-left:clamp(20px,5vw,44px);
        padding-right:clamp(20px,5vw,44px)}
  /* The touch floors and the 16px search field were scoped to <=600px, but
     601-900 is tablets: touch devices, with the same iOS zoom-on-focus. The
     focus chips measured 25px tall here and the search field 15px. Only the
     floors are raised, not the type scale, so nothing reflows. */
  .chip,.toggle{min-height:32px}
  .tag{min-height:30px}
  .srcs a, summary{min-height:32px;display:inline-flex;align-items:center}
  #q{font-size:16px}
}

/* Respect a reduced-motion preference: the retracting bar is decoration. */
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);
 color:var(--muted);font-size:12.5px;line-height:1.7}
footer dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;
 gap:7px 14px;align-items:baseline}
footer dt{font-weight:600;color:var(--ink);white-space:nowrap}
footer dd{margin:0}
footer p{margin:14px 0 0}
@media (max-width:600px){
  footer dl{grid-template-columns:1fr;gap:2px}
  footer dd{margin:0 0 8px}
}
.stats span[title]{cursor:help;border-bottom:1px dotted var(--line2)}
</style>
</head>
<body>
<a class="skip" href="#feed">Skip to stories</a>
<div class="wrap">
  <header>
    <div class="brand"><h1>Newsdesk</h1><span class="meta" id="meta">loading…</span></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="row1">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search dfir, cve, llm, ransomware…">
      <button class="toggle" id="filtToggle" aria-expanded="false"
              aria-controls="panel">Filters<span class="fdot" id="fdot" hidden></span></button>
    </div>
    <div class="strip"><div class="chips" id="cats"></div></div>
    <div class="strip" id="focusStrip"><div class="chips" id="focus"></div></div>
    <div class="active-tags" id="activeTags"></div>
    <div id="panel">
      <div class="tagbar">
        <span class="lbl2">When</span>
        <div class="chips" id="ages"></div>
        <button class="toggle" id="newOnly" aria-pressed="false">New only</button>
      </div>
      <div class="tagbar">
        <span class="lbl2">Sort</span>
        <div class="chips" id="sorts"></div>
        <!-- The live region moved to #applied. This one sits inside the
             Filters panel, which is now visibility:hidden while collapsed —
             and a hidden live region announces nothing, so on a phone it
             would have gone quiet exactly when it was needed. -->
        <span class="count" id="count"></span>
      </div>
      <div class="tagbar">
        <button class="toggle" id="tagToggle" aria-expanded="false">Tags</button>
        <button class="toggle clear" id="clearAll" disabled>Clear all filters</button>
      </div>
      <div class="chips" id="tagchips"></div>
    </div>
  </div>

  <!-- role=status carries the "N of 835" announcement, because this is the
       one summary that is on screen at every width whenever there is
       anything to report. -->
  <div id="applied" role="status" hidden></div>
  <main id="feed"></main>
  <footer id="foot"></footer>
</div>

<script>
const CATS = {cyber_attacks:"Attacks & Exploits", cyber_tools:"Tools & Tradecraft",
              tech_ai:"Tech & AI", markets:"Markets", india_world:"India & World",
              cybersecurity:"Cybersecurity"};

// Section order was a byproduct of JS object key-insertion order, so whichever
// category happened to own the highest-scoring item led the page — a security
// reader could open to Markets, and the order changed day to day. Fixed.
const CAT_ORDER = ["cyber_attacks","cyber_tools","tech_ai","markets","india_world"];
const catRank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
// Wording matters here: the badge answers "how well established is this",
// which is a different question from "how many outlets", already shown
// beside it. "unverified" means a single tier-C source, not "probably false".
const VD = {verified:"verified", corroborated:"corroborated",
            established:"established", unverified:"unverified",
            disputed:"disputed"};
// Newest-first is what the page falls back to whenever a sort is cleared,
// so the value is named once rather than spelled out at each use.
const DEFAULT_SORT="newest";
let DATA=null, cat="all", activeTags=new Set(), query="", sort=DEFAULT_SORT;
// Which headline stat is filtering the page, if any: "", critical, verified,
// corroborated, new, rejected.
let flag="", REJ=null;

// Show 12, then let the reader ask for more. Choice-overload work shows
// satisfaction down and deferral up as options multiply, and F-pattern
// fixation decays down a long list, so cards 13-40 are barely seen anyway.
// Explicit paging also preserves positional memory ("near the bottom of the
// first screen") that infinite scroll destroys.
const PAGE = 12;
let shown = PAGE;

// --- shareable state ---------------------------------------------------
// Filters live in the URL hash so a filtered view can be bookmarked, shared
// or survive a refresh. Without this, "look at the dfir items" means telling
// someone which chips to click.
// Filters used to be mirrored into the URL hash, which made every click
// rewrite the address bar to #cat=cyber_tools&sort=sources. That bought
// shareable filtered links at the cost of a URL nobody wants to look at or
// paste, so it is gone: the page always opens clean, and filtering is a
// thing you do to the page rather than a thing that changes its address.
function readState(){ /* nothing is restored - the page opens unfiltered */ }
function writeState(){
  // Strip any hash left over from an older bookmark rather than leaving a
  // stale one on screen that no longer describes what is displayed.
  if(location.hash)
    history.replaceState(null, "", location.pathname + location.search);
}

let onlyNew=false, age="all";

// Recency bands. The sections deliberately use different lookback windows
// (48h for news, 7 days for tools, 30 for research labs), so "show me only
// today" is a question the page could not previously answer.
// Durations, not days, was the wrong unit for a page you open in the
// morning: "3 days" is arithmetic the reader has to do, "Today" is not.
// All bands are cumulative — "Since yesterday" contains today — because a
// filter that excludes the newest stories is never what anyone wants.
const AGES={
  all:  {label:"All time",        hours:null},
  d1:   {label:"Today",           hours:24},
  d2:   {label:"Since yesterday", hours:48},
  d3:   {label:"Last 3 days",     hours:72},
  d7:   {label:"This week",       hours:168},
};

const SORTS={
  priority:{label:"Priority", fn:(a,b)=>
    (PRI[a.priority]-PRI[b.priority]) || (b.blend-a.blend)},
  newest:{label:"Newest", fn:(a,b)=>
    new Date(b.published||0)-new Date(a.published||0)},
  sources:{label:"Most sources", fn:(a,b)=>
    (b.corroboration-a.corroboration) || (PRI[a.priority]-PRI[b.priority])},
};
const PRI={critical:0, important:1, minor:2};

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ago(iso){
  if(!iso) return "";
  const h=(Date.now()-new Date(iso))/36e5;
  if(h<1) return Math.max(1,Math.round(h*60))+"m ago";
  if(h<24) return Math.round(h)+"h ago";
  return Math.round(h/24)+"d ago";
}

// Highlight matches, but only after escaping — never build HTML from raw input.
function hl(text){
  const safe = esc(text);
  if(!query) return safe;
  const terms = query.split(/\s+/).filter(t=>t.length>1)
    .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!terms.length) return safe;
  return safe.replace(new RegExp("("+terms.join("|")+")","ig"), "<mark>$1</mark>");
}

// "Label: value" renders the label in bold; plain strings pass through.
function fact(f){
  const i = f.indexOf(":");
  if(i>0 && i<42) return "<b>"+hl(f.slice(0,i))+"</b>"+hl(f.slice(i));
  return hl(f);
}

function haystack(it){
  return [it.title, it.summary, it.bottom_line, it.one_liner,
          (it.key_facts||[]).join(" "), (it.tags||[]).join(" "),
          it.sources.map(s=>s.name).join(" ")].join(" ").toLowerCase();
}

// The headline counts were decoration: five numbers a reader could read but
// not act on. Each is now the filter it describes, so "14 verified" answers
// "which fourteen?" in one click.
const FLAG_LABEL={new:"new today", critical:"needs attention",
  verified:"verified", corroborated:"corroborated", rejected:"not published",
  published:"published only"};

const FLAGS={
  new:         it=>!!it.is_new,
  critical:    it=>it.priority==="critical",
  verified:    it=>it.verdict==="verified",
  corroborated:it=>it.verdict==="corroborated",
  // Held-back stories now sit in the same list as everything else, so these
  // two are the halves of it rather than a separate page.
  published:   it=>!it.held_back,
  rejected:    it=>!!it.held_back,
};

function matches(it){
  if(onlyNew && !it.is_new) return false;
  if(flag && FLAGS[flag] && !FLAGS[flag](it)) return false;
  const lim=AGES[age] && AGES[age].hours;
  if(lim){
    if(!it.published) return false;               // undated cannot be "recent"
    if((Date.now()-new Date(it.published))/36e5 > lim) return false;
  }
  if(cat!=="all" && it.category!==cat) return false;
  for(const t of activeTags) if(!(it.tags||[]).includes(t)) return false;
  if(!query) return true;
  const hay = haystack(it);
  return query.split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}

function card(it){
  // Card structure follows the evidence, not taste:
  //
  //  * TWO framing layers, not four. Chandler & Sweller's redundancy effect
  //    says that when several sources are each independently intelligible,
  //    showing them all forces mental reconciliation and produces WORSE
  //    learning than showing one. Headline + one deck is also the journalism
  //    standfirst convention NN/g endorse unchanged for the web.
  //  * Key facts are the DEFAULT body; the prose summary moves behind
  //    disclosure. Readers stop at layer two believing they are informed
  //    (the "illusion of knowledge" finding), so layer two must carry the
  //    concrete numbers rather than an abstract significance claim.
  //  * Badges only for exceptions. Pennycook et al. showed labelling a
  //    subset makes the UNLABELLED subset read as verified, so a chip on
  //    every card is both decoration and a lie about everything else.
  const byName=new Map();
  for(const s of it.sources) if(!byName.has(s.name)) byName.set(s.name,s);
  const named=[...byName.values()];

  // Two named outlets beat a bare count: the Trust Project work found a
  // SINGLE transparency feature moves nothing, while concrete named
  // indicators measurably raised trust. Same width, real information.
  // The rest stay one click away rather than hidden behind "+3". "Who says
  // so" is the question a reader asks about anything surprising, and a count
  // is not an answer to it. Each row carries the domain too, since a name
  // alone does not tell you whether it is the publisher or an aggregator.
  const link=o=>'<a href="'+esc(o.url)+'" target="_blank" rel="noopener" title="'+
    esc(o.domain||"")+'">'+esc(o.name)+'</a>';
  const shown=named.slice(0,2).map(link);
  const rest=named.slice(2);
  // Count what is actually listed. The rail used to print `corroboration`,
  // which counts INDEPENDENT outlets after syndication collapsing, while the
  // row below listed every distinct name — so a card could read "3 outlets"
  // above six links. A reader who checks stops trusting every number.
  const more=rest.length
    ? '<details class="srcmore"><summary>' + rest.length + ' more</summary>'+
      '<div class="srclist">'+rest.map(o=>
        '<span class="srcrow">'+link(o)+
        '<span class="dom">'+esc(o.domain||"")+'</span></span>').join("")+
      '</div></details>'
    : "";
  const prim=(it.primary_links||[]).length
    ? '<a class="primary" href="'+esc(it.primary_links[0])+
      '" target="_blank" rel="noopener">primary source</a>' : "";

  // At most three facts. Concreteness aids recall; a long list stops being
  // scannable and becomes another wall of text.
  const facts=(it.key_facts||[]).slice(0,3);
  const factHtml=facts.length
    ? '<ul class="facts">'+facts.map(f=>"<li>"+fact(f)+"</li>").join("")+"</ul>" : "";

  const tags=(it.tags||[]).slice(0,5);
  const tagHtml=tags.length
    ? '<div class="tags">'+tags.map(t=>
      '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+"</button>").join("")+"</div>" : "";

  // The trace is the agent's own scoring arithmetic. It was being dumped as
  // an unlabelled bullet list directly under the claims, so a reader met
  // "blend 89 = trust 100 / interest 75 / corrob 100" with nothing telling
  // them what it was or why it was there. Notation a reader cannot decode is
  // worse than no notation: it makes the whole card look unfinished. Every
  // line now says what it means in words, and the block is collapsed behind
  // a heading that names it.
  // De-duplicated: the pipeline appends "summary: the article's opening
  // sentences…" once per stage that falls back to the extract, so 37 cards a
  // day printed the same sentence twice in a row. A reasoning trace that
  // repeats itself reads as a bug in the reasoning, not in the logging.
  const trace=[...new Set(it.trace||[])]
    .map(t=>"<li>"+esc(human(t))+"</li>").join("");
  const CLAIM_MARK={entailed:"✓", contradicted:"✗", neutral:"?"};
  const claims=(it.claims||[]).map(c=>
    '<li class="cl '+esc(c.status||"unchecked")+'">'+
    '<span class="ck">'+(CLAIM_MARK[c.status]||"·")+'</span>'+
    esc(c.text)+'</li>').join("");

  // Only the exceptions get a chip. "important" is the unlabelled default.
  const pri = it.priority==="critical"
    ? '<span class="chip-crit">critical</span>' : "";
  const vd = (it.verdict==="unverified"||it.verdict==="disputed")
    ? '<span class="chip-warn">'+esc(VD[it.verdict]||it.verdict)+'</span>' : "";
  // Sections use windows up to 30 days, so a good story legitimately stays on
  // the page for days. Without this the page looks unchanged even when a
  // third of it is new, which reads as "the agent stopped running".
  const isNew = it.is_new ? '<span class="chip-new">new</span>' : "";
  // Marked, with the reason, rather than silently mixed in. A reader who
  // cannot see which stories cleared the checks learns nothing from the fact
  // that the others did not.
  const held = it.held_back
    ? '<span class="chip-held">not published</span>' : "";
  // Most of the page is now extractive: the article's own opening sentences,
  // with no model summary and no claim checking behind it. Saying so is the
  // difference between broad coverage and quietly implying that 900 stories
  // were all verified.
  const raw = (it.summary_source==="extract" && !it.held_back)
    ? '<span class="chip-raw" title="The article&#39;s own opening lines. '+
      'No model summary and no fact-check — open the source to read it.">'+
      'unsummarised</span>' : "";
  const heldWhy = it.held_back && it.reject_reason
    ? '<p class="heldwhy">Held back: '+esc(_heldReason(it.reject_reason))+'</p>'
    : "";

  const prose =
    (it.summary?'<p class="body">'+hl(it.summary)+'</p>':"")+
    (it.one_liner?'<p class="why">'+hl(it.one_liner)+'</p>':"")+
    (claims?'<div class="claims"><b>Claims checked against the source</b><ul>'+
      claims+'</ul></div>':"");
  const scoreBlock = trace
    ? '<details class="score"><summary>Why it ranked here</summary>'+
      '<ul class="tr">'+trace+'</ul></details>' : "";
  // With prose: one toggle hiding all of it, scoring nested inside. Without
  // prose (a held-back card, where the summary was removed): the scoring
  // block on its own, because "Full summary" would be a promise of something
  // that is not there.
  //
  // The label has to follow the same rule. 530 of today's 835 cards are
  // extractive, carry the "unsummarised" chip whose tooltip reads "No model
  // summary and no fact-check", and then offered a disclosure labelled "Full
  // summary and how it was checked" four lines below it. Opening it produced
  // the article's scraped opening paragraph and no claim list at all, which
  // is exactly what the chip said. Checked against the data: an extractive
  // card never has claims and never has a one_liner, so the shorter label is
  // not hiding anything.
  const detailLabel = it.summary_source==="extract"
    ? "The article’s opening lines"
    : "Full summary and how it was checked";
  const detail = prose
    ? '<details><summary>'+detailLabel+'</summary>'+
      prose+scoreBlock+'</details>'
    : scoreBlock;

  // Rail order is rarest first, because the rail is read left to right and
  // the reader is scanning for the few cards that matter. Today's counts:
  // critical 5, not published 26, unverified 160, new 464, unsummarised 530.
  // "new" used to lead, so on the five cards that are both critical and new
  // the first thing the eye met was the chip shared with 463 others, and
  // "critical" sat third. Sorted by how much each chip narrows the page,
  // the loudest position now belongs to the rarest signal.
  return '<article class="'+esc(it.priority)+'">'+
    (pri||vd||isNew||held||raw
      ? '<div class="rail">'+pri+held+vd+isNew+raw+'</div>' : "")+
    '<h3><a href="'+esc(it.sources[0].url)+'" target="_blank" rel="noopener">'+
      hl(it.title)+'</a></h3>'+
    (it.bottom_line?'<p class="deck">'+hl(it.bottom_line)+'</p>':"")+
    heldWhy+
    factHtml+
    '<div class="srcs"><span class="srclabel">Source:</span>'+
      shown.join('<span class="dot2">·</span>')+more+prim+
      (band(it.published)?'<span class="when">'+esc(band(it.published))+'</span>':"")+
    '</div>'+
    tagHtml+
    detail+
  '</article>';
}

// Turn one scoring-trace line into a sentence. Anything unrecognised falls
// through unchanged, so a new line added in the pipeline degrades to the raw
// string rather than disappearing from the page.
const TRACE_RULES=[
  [/^blend (\d+) = trust (\d+) \/ interest (\d+) \/ corrob (\d+)$/,
   (m)=>"Overall score "+m[1]+" out of 100 \u2014 source trust "+m[2]+
        ", importance "+m[3]+", corroboration "+m[4]],
  [/^claims entailed (\d+)\/(\d+) \(\d+%\)$/,
   (m)=>m[1]+" of "+m[2]+" claims in the summary traced back to the source article"],
  [/^tier ([A-C]) \(\+\d+\)$/,
   (m)=>"Publisher reliability rated tier "+m[1]],
  [/^importance (\d+)\/(\d+) from cache$/,
   (m)=>"Rated "+m[1]+" of "+m[2]+" for importance (reused from an earlier run)"],
  [/^importance (\d+)\/(\d+) from (.+)$/,
   (m)=>"Rated "+m[1]+" of "+m[2]+" for importance by "+m[3]],
  [/^demoted: critical capped at (\d+)$/,
   (m)=>"Not flagged critical \u2014 the page shows at most "+m[1]+" critical stories a day"],
  [/^(\d+) independent outlets \(\+\d+\)$/,
   (m)=>m[1]+" independent outlets reported it"],
  [/^primary source anchor \(\+\d+\)$/,
   ()=>"Anchored to a primary source \u2014 an advisory, CVE record or official notice"],
  [/^verified: primary source artifact$/,
   ()=>"Verified: the story rests on a primary source document"],
  [/^verified: (\d+) independent outlets$/,
   (m)=>"Verified: "+m[1]+" independent outlets reported it separately"],
  [/^judge \(([^)]+)\): (.+)$/,
   (m)=>"A second model ("+m[1]+") re-read the summary against the article: "+m[2]],
  [/^single outlet, established publication \(tier ([A-C])\)$/,
   (m)=>"Only one outlet has it, but that outlet is tier "+m[1]],
];
function human(t){
  for(const [re,fn] of TRACE_RULES){ const m=re.exec(t); if(m) return fn(m); }
  return t;
}

// What the gate threw away, and why. Published as its own file rather than
// folded into news.json: it is read once out of curiosity, so it should not
// cost every reader the download. Two reasons dominate — a story older than
// its category's lookback window, and a summary sentence the verifier could
// not trace back to the article it came from.
function drawRejects(feed){
  writeState();
  paintApplied(REJ && REJ.items ? REJ.items.length : 0);
  const live=document.getElementById("count");
  if(live) live.textContent="";
  const dot=document.getElementById("fdot"); if(dot) dot.hidden=true;

  const render=()=>{
    const items=(REJ&&REJ.items)||[];
    if(!items.length){
      feed.innerHTML='<p class="empty">Nothing was rejected in this run.</p>';
      return;
    }
    // The raw reasons carry a date per row, so grouping on them verbatim
    // produced one heading per calendar day saying the same thing. Group on
    // what actually happened, in the reader's words.
    const REASONS=[
      [/outside lookback window/i,
       "Too old for the window its section uses"],
      [/claim\(s\) not supported/i,
       "A sentence in the summary could not be traced back to the article"],
      [/contradicted by the source/i,
       "A second model found a claim the article contradicts"],
    ];
    const groups=new Map();
    for(const it of items){
      const raw=it.reject_reason||"no reason recorded";
      const hit=REASONS.find(([re])=>re.test(raw));
      const why=hit?hit[1]:raw;
      if(!groups.has(why)) groups.set(why,[]);
      groups.get(why).push(it);
    }
    let html='<p class="rejnote">These were harvested and then refused before '+
      'publishing. Nothing here is on the page above.</p>';
    for(const [why,rows] of [...groups.entries()].sort((a,b)=>b[1].length-a[1].length)){
      html+='<h2 class="sec">'+esc(why)+' <span class="win">'+rows.length+'</span></h2>'+
        '<ul class="rejlist">'+rows.map(it=>{
          const src=(it.sources&&it.sources[0])||{};
          return '<li><a href="'+esc(src.url||"#")+'" target="_blank" rel="noopener">'+
            esc(it.title||"(untitled)")+'</a>'+
            '<span class="dom">'+esc(src.name||src.domain||"")+
            (it.published?" · "+esc(band(it.published)):"")+'</span></li>';
        }).join("")+'</ul>';
    }
    feed.innerHTML=html;
  };

  if(REJ){ render(); return; }
  feed.innerHTML='<p class="empty">Loading the rejected list…</p>';
  fetch("rejected.json",{cache:"no-cache"})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ REJ=d; render(); })
    .catch(e=>{ feed.innerHTML='<p class="empty">Could not load rejected.json ('+
      esc(String(e))+').<br>It is written next to news.json by the publish stage.</p>'; });
}

// Changing what the feed contains, or the order it is in, without moving the
// page leaves the reader looking at the middle of a list that just became a
// different list. On desktop the controls are a sticky rail, so this happens
// on every sort click made while scrolled down: the story under the cursor
// vanishes, nothing visibly changes, and the control reads as broken. Typing
// in the search box is excluded - yanking the page on every keystroke is
// worse than the problem it fixes.
// Instant, not smooth. draw() replaces the whole feed on the very next line,
// and a running smooth scroll against a DOM that is being rebuilt under it
// either aborts partway or lands somewhere arbitrary. A filter change is a
// mode switch rather than a navigation, so a jump is also the correct feel,
// and it needs no prefers-reduced-motion branch.
// Every control that can narrow the page, in one place. Three separate
// hand-written versions of this test had already drifted apart - the dot
// beside Filters was checking a different set of conditions from the Escape
// key, so the page could be filtered with nothing indicating it.
function anyFilter(){
  return cat!=="all" || age!=="all" || flag!=="" || onlyNew ||
         query!=="" || activeTags.size>0 || sort!==DEFAULT_SORT;
}

// Reset everything a reader can set, and put the controls back in step with
// it. Escape, the button in the panel and the one in the empty state all go
// through here so they cannot disagree about what "clear" means.
function clearAll(){
  cat="all"; age="all"; flag=""; onlyNew=false; query="";
  activeTags.clear(); sort=DEFAULT_SORT; shown=PAGE;
  const q=document.getElementById("q"); if(q) q.value="";
  const nb=document.getElementById("newOnly");
  if(nb) nb.setAttribute("aria-pressed","false");
  const st=document.getElementById("stats");
  if(st) [...st.children].forEach(x=>x.setAttribute("aria-pressed","false"));
  if(window.syncChips) window.syncChips();
  toTop(); draw();
}

// The date bands are cumulative and the default sort is newest-first, so the
// FIRST TWELVE CARDS ARE IDENTICAL for Today, Since yesterday, Last 3 days
// and All time. Clicking through them changed the result count from 40 to 12
// while the visible page did not move a pixel - and the count was a small
// line inside a panel that is collapsed by default on a phone. The filter
// was working perfectly and looked completely dead, which is worse than
// broken because there is nothing to debug.
//
// This puts what is applied, and how much it cut, immediately above the
// first card - where the reader is already looking when they click.
// The raw reason carries a date per row and internal model names. Say what
// happened instead.
const HELD_REASONS=[
  [/outside lookback window/i, "older than the window this section uses"],
  [/claim\(s\) not supported/i,
   "our summary made a point the article does not support, so the summary "+
   "was removed and only the original headline and source are shown"],
  [/contradicted by the source/i,
   "a second model found our summary contradicted the article, so the "+
   "summary was removed"],
];
function _heldReason(raw){
  const hit=HELD_REASONS.find(([re])=>re.test(raw||""));
  return hit ? hit[1] : (raw||"no reason recorded");
}

function paintApplied(count){
  const box=document.getElementById("applied");
  if(!box) return;
  if(!anyFilter()){ box.hidden=true; box.innerHTML=""; return; }

  const bits=[];
  if(cat!=="all")        bits.push(esc(CATS[cat]||cat));
  if(age!=="all" && AGES[age]) bits.push(esc(AGES[age].label));
  if(flag)               bits.push(esc(FLAG_LABEL[flag]||flag));
  if(onlyNew)            bits.push("new only");
  if(sort!==DEFAULT_SORT) bits.push("by "+esc(SORTS[sort].label.toLowerCase()));
  // Show the focus row's label, not the raw tag: the chip says "CVEs"
  // so the summary should not say "cve".
  const FLABEL=Object.fromEntries(FOCUS);
  for(const t of activeTags) bits.push(esc(FLABEL[t]||t));
  if(query)              bits.push('"'+esc(query)+'"');

  const total=DATA?DATA.items.length:count;
  box.hidden=false;
  box.innerHTML=
    '<span class="ap-n"><b>'+count+'</b> of '+total+'</span>'+
    '<span class="ap-list">'+bits.map(b=>'<span class="ap-b">'+b+'</span>').join("")+
    '</span>'+
    '<button class="ap-x" id="applyClear" title="Clear every filter">Clear</button>';
  const x=document.getElementById("applyClear");
  if(x) x.onclick=()=>clearAll();
}

// The stylesheet honours prefers-reduced-motion, but scroll-behavior set in
// CSS only governs scrolls that ask for "auto"; an explicit behavior:"smooth"
// in script wins over it. The three scripted scrolls on this page all passed
// "smooth" literally, so the one accessibility preference the page can read
// was the one thing still animating for readers who had switched it off.
const REDUCED=window.matchMedia("(prefers-reduced-motion:reduce)");
const easing=()=>REDUCED.matches?"auto":"smooth";

function toTop(){
  if(window.scrollY>0) window.scrollTo({top:0, behavior:"auto"});
}

// Recency as a coarse band, in the metadata row rather than beside the
// badges — it is scent, not a warning, and it must not compete with the
// headline for the first fixation.
function band(iso){
  if(!iso) return "";
  const h=(Date.now()-new Date(iso))/36e5;
  if(h<1) return "just now";
  if(h<6) return Math.round(h)+"h";
  if(h<24) return "today";
  if(h<48) return "yesterday";
  return Math.round(h/24)+" days";
}

function draw(){
  const feed=document.getElementById("feed");
  const items=DATA.items.filter(matches).sort(SORTS[sort].fn);

  writeState();
  const live=document.getElementById("count");
  // Naming only the non-default sort meant the label vanished exactly when
  // the reader had just changed it, which reads as the click doing nothing.
  if(live) live.textContent =
    items.length+" of "+DATA.items.length+" stories, by "+
    SORTS[sort].label.toLowerCase();
  const dot=document.getElementById("fdot");
  const on=anyFilter();
  if(dot) dot.hidden = !on;
  paintApplied(items.length);
  drawFocus();
  // Disabled when there is nothing to clear, so the button reports the state
  // of the page rather than sitting there looking equally clickable always.
  const ca=document.getElementById("clearAll");
  if(ca) ca.disabled = !on;

  if(!items.length){
    feed.innerHTML='<p class="empty">Nothing matches.'+
      (query?' No story mentions &ldquo;'+esc(query)+'&rdquo;.':'')+
      '<br><button class="chip" id="clearNow">Clear all filters</button></p>';
    const btn=document.getElementById("clearNow");
    if(btn) btn.onclick=clearAll;
    drawTags(items); return;
  }

  const page=items.slice(0, shown);

  // Sorting by time or source count deliberately drops the category
  // headings — grouping fights the ordering the reader just asked for.
  let html;
  if(sort==="priority"){
    const groups={};
    for(const it of page){ (groups[it.category]=groups[it.category]||[]).push(it); }
    html=Object.keys(groups).sort((a,b)=>catRank(a)-catRank(b)).map(c=>
      '<h2 class="sec">'+esc(CATS[c]||c)+' &middot; '+groups[c].length+
      windowNote(c)+'</h2>'+
      groups[c].map(card).join("")).join("");
  }else{
    html=page.map(card).join("");
  }

  if(items.length>shown){
    html+='<button class="loadmore" id="loadmore">Show '+
      Math.min(PAGE, items.length-shown)+' more'+
      '<span class="rest"> &middot; '+(items.length-shown)+' remaining</span></button>';
  }
  feed.innerHTML=html;

  const lm=document.getElementById("loadmore");
  if(lm) lm.onclick=()=>{
    const first=shown;            // keep the reader's place
    shown+=PAGE; draw();
    const cards=document.querySelectorAll("article");
    if(cards[first]) cards[first].scrollIntoView({block:"start",behavior:easing()});
  };
  drawTags(items);
}

// Sections use different lookback windows — 48h for news, 7 days for tools,
// because research blogs publish weekly. Saying so stops a 5-day-old tools
// item reading as staleness.
function windowNote(catKey){
  const h=(DATA.per_category_hours||{})[catKey];
  if(!h) return "";
  const label = h>=48 ? Math.round(h/24)+" days" : h+"h";
  return ' <span class="win" title="This section looks back '+label+
         ', because its sources publish less often">last '+label+'</span>';
}

// Tag chips reflect what is actually on screen, so the facets never offer a
// filter that would return nothing.
// The facets worth a permanent control, in the order a security reader
// reaches for them. "Attacks & Exploits" was one pile of 339 stories a day
// and the only way to split it was a drawer that is shut by default — so a
// reader hunting a named ransomware gang had to know the tag existed, open
// the drawer and find it among thirty others.
const FOCUS=[["cve","CVEs"],["threat-actor","Threat actors"],
             ["malware","Malware"],["ransomware","Ransomware"],
             ["exploit","Exploits"],["incident","Breaches"],
             ["bugbounty","Bug bounty"],["writeup","Write-ups"],
             ["tool","Tools"],["howto","How-to"]];

// The population every facet count is measured against: everything the reader
// has already narrowed to, EXCEPT the tags themselves, so each number says
// what that chip would still leave rather than what survives a selection
// already made.
//
// The focus row computed this; the tag drawer counted against the category
// alone, although the comment above it promised "the facets never offer a
// filter that would return nothing". With "need attention" pressed — five
// stories — the drawer still offered "ai 343" and "research 234", and either
// one emptied the page. One base now feeds both, so the two rows of facets
// can no longer disagree about what is on screen.
//
// Search is deliberately excluded. Recounting 36 chips on every keystroke
// would make the drawer reflow under the reader's hand while they type.
function facetBase(){
  return DATA.items.filter(it=>{
    if(cat!=="all" && it.category!==cat) return false;
    if(onlyNew && !it.is_new) return false;
    if(flag && FLAGS[flag] && !FLAGS[flag](it)) return false;
    const lim=AGES[age] && AGES[age].hours;
    if(lim){
      if(!it.published) return false;
      if((Date.now()-new Date(it.published))/36e5 > lim) return false;
    }
    return true;
  });
}

function drawFocus(){
  const box=document.getElementById("focus");
  if(!box) return;
  const base=facetBase();
  const rows=FOCUS
    .map(([t,label])=>[t,label,base.filter(i=>(i.tags||[]).includes(t)).length])
    .filter(r=>r[2]>0);
  document.getElementById("focusStrip").hidden = rows.length < 2;
  box.innerHTML=rows.map(([t,label,n])=>
    '<button class="chip" data-tag="'+esc(t)+'" aria-pressed="'+
    activeTags.has(t)+'">'+esc(label)+
    '<span class="n"><span class="sep3">&middot;</span>'+n+'</span></button>').join("");
}

function drawTags(visible){
  const counts={};
  for(const it of facetBase()){
    for(const t of it.tags||[]) counts[t]=(counts[t]||0)+1;
  }
  const ordered=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const box=document.getElementById("tagchips");
  const toggle=document.getElementById("tagToggle");
  if(toggle) toggle.textContent = activeTags.size
    ? "Tags · "+activeTags.size+" on" : "Tags";

  // Active filters stay visible next to the toggle even when the drawer is
  // shut, so you can always see and undo what is filtering the page.
  const act=document.getElementById("activeTags");
  if(act) act.innerHTML=[...activeTags].map(t=>
    '<button class="chip" data-tag="'+esc(t)+'">'+esc(t)+' ×</button>').join("");

  box.innerHTML=ordered.map(([t,n])=>
    '<button class="chip" data-tag="'+esc(t)+'" aria-pressed="'+activeTags.has(t)+'">'+
    esc(t)+'<span class="n">'+n+'</span></button>').join("");
}

// All times render in the READER's timezone, resolved from the browser rather
// than assumed. The stored values are UTC ISO8601, so this is a display
// concern only — a page opened in a different country still reads correctly.
function fmt(iso){
  const d=new Date(iso);
  return d.toLocaleString(undefined,
    {weekday:"short", day:"numeric", month:"short",
     hour:"2-digit", minute:"2-digit"});
}

function until(iso){
  const mins=Math.round((new Date(iso)-Date.now())/6e4);
  if(mins<=0) return "due now";
  if(mins<60) return "in "+mins+" min";
  const h=Math.floor(mins/60), m=mins%60;
  if(h<24) return "in "+h+"h"+(m?" "+m+"m":"");
  return "in "+Math.round(h/24)+"d";
}

// Three full timestamps and a timezone name wrapped to two lines and pushed
// every story below the fold. What a reader actually needs here is "is this
// fresh" and "when does it change" — two short phrases. The exact clock
// times, the schedule and the timezone stay reachable as tooltips, which is
// where detail belongs when it is checked once and never again.
function updateLine(d){
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"local time";
  const full=t=>esc(fmt(t))+" ("+esc(tz)+")";
  let out='<span title="'+full(d.generated_at)+'">Updated '+
          esc(ago(d.generated_at))+"</span>";
  if(d.next_update){
    let tip=full(d.next_update);
    if(d.schedule && d.schedule.display_name)
      tip+=" — runs "+esc(d.schedule.display_name)+" daily";
    out+=' <span class="sep2">&middot;</span> <span class="dim" title="'+tip+
         '">next '+esc(until(d.next_update))+"</span>";
  }
  // news.json only ever describes today, so the page could say "40 stories"
  // for months without ever answering "how much has this found for me".
  const t=d.totals;
  if(t && t.published){
    out+=' <span class="sep2">&middot;</span> <span class="dim" title="'+
         esc(t.published+" published and "+(t.held||0)+" held back across "+
             t.runs+" daily runs since "+t.since)+'">'+
         esc(t.published.toLocaleString())+" stories over "+esc(t.runs)+
         (t.runs===1?" run":" runs")+"</span>";
  }
  return out;
}

function boot(d){
  DATA=d;
  readState();
  document.getElementById("q").value = query;
  document.getElementById("meta").innerHTML=updateLine(d);
  // Plain language, and only counts that are actually meaningful. "Blocked at
  // the gate" was internal jargon that meant nothing to a reader. Each count
  // is a button that filters to exactly the stories it counts — a number you
  // cannot open is a number you cannot check.
  // Every count is derived from the very predicate that will filter the page
  // when it is clicked, rather than read out of news.json's `counts` block.
  // Those two had drifted: counts.new said 450 because the pipeline tallies
  // new stories among the PUBLISHED ones, while FLAGS.new matches every
  // is_new item including the 14 that were held back — so the button read
  // "450 new today" and the bar under it answered "464 of 835". A number you
  // can click has to be the number you get, or checking it once teaches the
  // reader to trust none of them.
  const nFlag=f=>d.items.filter(FLAGS[f]).length;
  const stat=(label,title,f)=>
    '<button class="stat" data-flag="'+esc(f)+'" title="'+esc(title)+'"'+
    ' aria-pressed="'+(flag===f)+'"><b>'+nFlag(f)+'</b> '+label+'</button>';
  document.getElementById("stats").innerHTML=
    // Today's haul leads. It is the one number that answers "is there
    // anything I have not already read", which is why the page is open.
    '<button class="stat lead" data-flag="new" title="'+
      esc("Stories that were not on this page after any previous run. Zero is "
          +"a real answer: it means today's harvest found nothing the last "
          +"run had not already published.")+'" aria-pressed="'+(flag==="new")+
      '"><b>'+nFlag("new")+'</b> new today</button>'+
    stat("stories","Passed the checks and published normally",
         "published")+
    stat("need attention",
         "Highest priority — worth acting on today","critical")+
    stat("verified",
         "Backed by an official source (CISA, a CVE record, a vendor advisory) "
         +"or reported independently by 3+ outlets","verified")+
    stat("corroborated",
         "Two independent outlets report the same story","corroborated")+
    stat("not published",
         "Refused before publishing: either too old for the window, or a "
         +"sentence in the summary could not be traced back to its source "
         +"article. They are on the page, marked, with the reason on each "
         +"card. Click to see only those.","rejected");

  document.getElementById("stats").onclick=e=>{
    const b=e.target.closest("button[data-flag]"); if(!b) return;
    flag = (flag===b.dataset.flag) ? "" : b.dataset.flag;
    shown=PAGE;
    [...e.currentTarget.children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.flag===flag));
    toTop(); draw();
  };

  const cats=["all",...new Set(d.items.map(i=>i.category))];
  const cbox=document.getElementById("cats");
  cbox.innerHTML=cats.map(x=>{
    const n=x==="all"?d.items.length:d.items.filter(i=>i.category===x).length;
    // esc() even though categories come from our own config: an unescaped
    // value inside an attribute is an injection waiting for the day the data
    // source changes.
    return '<button class="chip" data-cat="'+esc(x)+'" aria-pressed="'+(x===cat)+'">'+
      (x==="all"?"All":esc(CATS[x]||x))+'<span class="n">'+n+'</span></button>';
  }).join("");

  cbox.onclick=e=>{
    const b=e.target.closest("button[data-cat]"); if(!b) return;
    cat=b.dataset.cat; activeTags.clear();
    shown=PAGE;
    [...cbox.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
    toTop(); draw();
  };
  const fbox=document.getElementById("focus");
  if(fbox) fbox.onclick=e=>{
    const b=e.target.closest("button[data-tag]"); if(!b) return;
    const t=b.dataset.tag;
    activeTags.has(t)?activeTags.delete(t):activeTags.add(t);
    shown=PAGE; toTop(); draw();
  };
  document.getElementById("tagchips").onclick=e=>{
    const b=e.target.closest("button[data-tag]"); if(!b) return;
    const t=b.dataset.tag;
    activeTags.has(t)?activeTags.delete(t):activeTags.add(t);
    shown=PAGE;
    toTop(); draw();
  };
  document.getElementById("activeTags").onclick=e=>{
    const b=e.target.closest("button[data-tag]"); if(!b) return;
    activeTags.delete(b.dataset.tag); toTop(); draw();
  };

  // The tag list is long enough to bury the article underneath it, so it is
  // collapsed by default and opened on demand.
  const drawer=document.getElementById("tagchips");
  const toggle=document.getElementById("tagToggle");
  toggle.onclick=()=>{
    const open=drawer.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open);
  };

  // When / Sort / New only / Tags together were four rows of chrome sitting
  // permanently above the text. They are refinements — reached after you have
  // started reading, not before — so they collapse behind one button. The dot
  // is the price of hiding them: a closed panel must still say that something
  // inside it is filtering what you see, or the reader is looking at a subset
  // and has no way to tell.
  const clearBtn=document.getElementById("clearAll");
  if(clearBtn) clearBtn.onclick=()=>clearAll();

  const panel=document.getElementById("panel");
  const filt=document.getElementById("filtToggle");
  filt.onclick=()=>{
    const open=panel.classList.toggle("open");
    filt.setAttribute("aria-expanded", open);
    if(!open) drawer.classList.remove("open"),
              toggle.setAttribute("aria-expanded","false");
  };

  // Retract the whole control bar while scrolling down, bring it back on the
  // way up — the reading area is never covered by chrome you are not using.
  const bar=document.querySelector(".controls");
  let lastY=window.scrollY, ticking=false;
  window.addEventListener("scroll",()=>{
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{
      const y=window.scrollY;
      const goingDown = y>lastY && y>140;
      // Once you are reading, the search box is dead weight overhead; the
      // section strip is the only control worth keeping within reach. Drop
      // to the strip alone so the bar that comes back on scroll-up is one
      // row, not four.
      bar.classList.toggle("compact", y>240 && !panel.classList.contains("open") &&
                           document.activeElement!==document.getElementById("q"));
      // Never hide the bar while a filter is open or focused, or the control
      // vanishes mid-interaction.
      const busy = drawer.classList.contains("open") ||
                   panel.classList.contains("open") ||
                   document.activeElement===document.getElementById("q");
      bar.classList.toggle("hidden", goingDown && !busy);
      lastY=y; ticking=false;
    });
  },{passive:true});
  document.getElementById("feed").addEventListener("click",e=>{
    const b=e.target.closest("button.tag"); if(!b) return;
    activeTags.clear(); activeTags.add(b.dataset.tag);
    window.scrollTo({top:0,behavior:easing()}); draw();
  });

  let timer;
  document.getElementById("q").addEventListener("input",e=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{ query=e.target.value.trim().toLowerCase(); draw(); },110);
  });

  // --- sort control ----------------------------------------------------
  // Each band shows how many stories it would leave, so the reader can see
  // "24 hours · 9" before clicking and never lands on an empty page.
  const abox=document.getElementById("ages");
  if(abox){
    abox.innerHTML=Object.entries(AGES).map(([k,v])=>{
      const n=v.hours==null ? d.items.length
        : d.items.filter(i=>i.published &&
            (Date.now()-new Date(i.published))/36e5 <= v.hours).length;
      // No count on the label. "Today" is a date, and a number printed next
      // to a date reads as part of it; the running total is already on the
      // result line, where one copy of it is enough.
      return '<button class="chip" data-age="'+k+'" aria-pressed="'+(k===age)+'"'+
             (n?"":' disabled title="No stories published in this window"')+'>'+
             esc(v.label)+'</button>';
    }).join("");
    abox.onclick=e=>{
      const b=e.target.closest("button[data-age]"); if(!b||b.disabled) return;
      age=b.dataset.age;
      [...abox.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
      shown=PAGE; toTop(); draw();
    };
  }

  const nb=document.getElementById("newOnly");
  if(nb){
    const n=d.items.filter(i=>i.is_new).length;
    nb.textContent = n ? "New only · "+n : "New only";
    nb.disabled = !n;
    // "New" means "not on this page after any previous run", so it can only
    // ever be answered by comparing two runs. Saying that is the difference
    // between a button that is off and a button that is broken.
    nb.title = n ? "Show only the "+n+" stories that were not here before"
                 : "Nothing is new since the last run, so there is nothing to "
                   +"filter to. This fills in once two runs have completed.";
    nb.onclick=()=>{
      onlyNew=!onlyNew;
      nb.setAttribute("aria-pressed", onlyNew);
      shown=PAGE; toTop(); draw();
    };
  }

  const sbox=document.getElementById("sorts");
  sbox.innerHTML=Object.entries(SORTS).map(([k,v])=>
    '<button class="chip" data-sort="'+k+'" aria-pressed="'+(k===sort)+'">'+
    esc(v.label)+'</button>').join("");
  sbox.onclick=e=>{
    const b=e.target.closest("button[data-sort]"); if(!b) return;
    // Pressing the active sort again turns it off and falls back to the
    // default, so the control behaves like the category and tag chips
    // instead of being the one group you can enter but never leave.
    sort = (b.dataset.sort===sort) ? DEFAULT_SORT : b.dataset.sort;
    // Deliberately NOT resetting `shown`. Sorting reorders the same set; the
    // filters change which stories exist and do reset it. Collapsing back to
    // the first 12 on a sort took away rows the reader had already opened.
    [...sbox.children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.sort===sort));
    toTop(); draw();
  };

  // --- keyboard navigation ---------------------------------------------
  // This is a reading site, so moving between stories should not require the
  // mouse. j/k mirror the convention every feed reader already uses.
  let cursor=-1;
  const cards=()=>[...document.querySelectorAll("article")];
  function focusCard(n){
    const all=cards(); if(!all.length) return;
    cursor=Math.max(0,Math.min(n,all.length-1));
    all.forEach(c=>c.classList.remove("cursor"));
    const el=all[cursor];
    el.classList.add("cursor");
    el.scrollIntoView({block:"center",behavior:easing()});
  }
  document.addEventListener("keydown",e=>{
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if(e.key==="/" && !typing){
      e.preventDefault();
      // The bar may be in its compact state with the input display:none, and
      // focus() on a hidden element silently does nothing.
      const b=document.querySelector(".controls");
      b.classList.remove("compact","hidden");
      document.getElementById("q").focus(); return;
    }
    if(e.key==="Escape"){
      if(typing){ e.target.blur(); }
      else if(anyFilter()) clearAll();
      return;
    }
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key==="j"){ e.preventDefault(); focusCard(cursor+1); }
    else if(e.key==="k"){ e.preventDefault(); focusCard(cursor-1); }
    else if(e.key==="o"||e.key==="Enter"){
      const el=cards()[cursor]; const a=el&&el.querySelector("h3 a");
      if(a) window.open(a.href,"_blank","noopener");
    }
    else if(e.key==="?"){
      const h=document.getElementById("help");
      if(h) h.open=!h.open;
    }
  });

  // Keep the chip rows in step with state restored from the URL.
  function syncChips(){
    [...document.getElementById("cats").children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.cat===cat));
    [...sbox.children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.sort===sort));
    const cb=document.getElementById("cats");
    if(cb) [...cb.children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.cat===cat));
    const ab=document.getElementById("ages");
    if(ab) [...ab.children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.age===age));
  }
  window.syncChips=syncChips;
  syncChips();

  // If a scheduled run has clearly been missed, say so rather than showing a
  // confidently stale page — the reader cannot tell the difference otherwise.
  if(d.next_update){
    const overdueHrs=(Date.now()-new Date(d.next_update))/36e5;
    if(overdueHrs>1){
      const w=document.createElement("div");
      w.className="stale";
      w.textContent="This page is overdue by "+Math.round(overdueHrs)+
        "h — the scheduled update has not run. Content below may be out of date.";
      document.querySelector("header").appendChild(w);
    }
  }

  document.getElementById("foot").innerHTML=
    '<details id="help"><summary>Keyboard shortcuts</summary>'+
    '<dl><dt><kbd>j</kbd> / <kbd>k</kbd></dt><dd>next / previous story</dd>'+
    '<dt><kbd>o</kbd> or <kbd>Enter</kbd></dt><dd>open the highlighted story</dd>'+
    '<dt><kbd>/</kbd></dt><dd>jump to search</dd>'+
    '<dt><kbd>Esc</kbd></dt><dd>clear all filters</dd>'+
    '<dt><kbd>?</kbd></dt><dd>this list</dd></dl></details>'+
    '<details><summary>What do these labels mean?</summary>'+
    '<dl>'+
    '<dt>verified</dt><dd>Traced to an official artifact — a CISA advisory, a '+
      'CVE record, a vendor security bulletin — or independently reported by '+
      'three or more outlets.</dd>'+
    '<dt>corroborated</dt><dd>Two independent outlets report it. Syndicated '+
      'copies of one wire story count as one outlet, not two.</dd>'+
    '<dt>established</dt><dd>A single outlet, but a known publication.</dd>'+
    '<dt>unverified</dt><dd>A single blog, repository or aggregator. Shown, '+
      'but treat it as one person&#39;s word.</dd>'+
    '<dt>disputed</dt><dd>Sources disagree, or a second model could not '+
      'confirm a claim against the source text.</dd>'+
    '<dt>not published</dt><dd>Refused before reaching this page — too old '+
      'for its section&#39;s window, or a sentence in the summary could not '+
      'be traced back to the article it came from. Every rejection is logged '+
      'with its reason.</dd>'+
    '</dl>'+
    '<p>These labels describe <em>sourcing</em>, not proven truth. '+
    '&ldquo;Verified&rdquo; means well attested, not guaranteed correct.</p>'+
    '</details>';
  draw();
}

fetch("news.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(boot)
  .catch(e=>{
    document.getElementById("meta").textContent="could not load news.json — "+e;
    document.getElementById("feed").innerHTML=
      '<p class="empty">Run <code>python run.py</code> first.</p>';
  });
</script>
</body>
</html>
